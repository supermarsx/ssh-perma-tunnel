# .cargo/config.toml — workspace-level cargo overrides.
#
# Linkers below are only consulted when targeting a non-host triple AND the
# build is invoked outside `cross` (which provides its own sysroot). Native
# builds (host == target) ignore these entries.
#
# Keep this file minimal: anything broader belongs in per-profile [profile.*]
# blocks in Cargo.toml.

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"

[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"
