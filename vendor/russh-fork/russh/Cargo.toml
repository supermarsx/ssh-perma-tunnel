[package]
authors = ["Pierre-Étienne Meunier <pe@pijul.org>"]
description = "A client and server SSH library."
documentation = "https://docs.rs/russh"
edition = "2018"
homepage = "https://github.com/warp-tech/russh"
keywords = ["ssh"]
license = "Apache-2.0"
name = "russh"
readme = "../README.md"
repository = "https://github.com/warp-tech/russh"
version = "0.46.0"
# t8-B1: bumped from upstream 1.65 because the `ml-kem` 0.3 crate (used for
# the mlkem768x25519-sha256 hybrid PQ KEX) declares rust-version 1.85. The
# outer workspace already requires 1.85 (Cargo.toml workspace.package.rust-
# version), so this brings the fork's local MSRV in sync with the consumer.
rust-version = "1.85"

[features]
default = ["flate2"]
openssl = ["russh-keys/openssl", "dep:openssl"]
vendored-openssl = ["openssl/vendored", "russh-keys/vendored-openssl"]
legacy-ed25519-pkcs8-parser = ["russh-keys/legacy-ed25519-pkcs8-parser"]

[dependencies]
aes = { workspace = true }
aes-gcm = "0.10"
cbc = { version = "0.1" }
async-trait = { workspace = true }
bitflags = "2.0"
byteorder = { workspace = true }
chacha20 = "0.9"
ctr = "0.9"
curve25519-dalek = "4.1.3"
digest = { workspace = true }
elliptic-curve = { version = "0.13", features = ["ecdh"] }
flate2 = { version = "1.0", optional = true }
futures = { workspace = true }
generic-array = "0.14"
hex-literal = "0.4"
hmac = { workspace = true }
log = { workspace = true }
num-bigint = { version = "0.4", features = ["rand"] }
once_cell = "1.13"
p256 = { version = "0.13", features = ["ecdh"] }
p384 = { version = "0.13", features = ["ecdh"] }
p521 = { version = "0.13", features = ["ecdh"] }
poly1305 = "0.8"
rand = { workspace = true }
rand_core = { version = "0.6.4", features = ["getrandom"] }
russh-cryptovec = { version = "0.7.0", path = "../cryptovec" }
russh-keys = { version = "0.46.0", path = "../russh-keys" }
sha1 = { workspace = true }
sha2 = { workspace = true }
ssh-encoding = { workspace = true }
ssh-key = { workspace = true }
subtle = "2.4"
thiserror = { workspace = true }
russh-util = { version = "0.46.0", path = "../russh-util" }
des = "0.8.1"
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
ml-kem = { version = "0.3.2", default-features = false, features = ["getrandom"] }

[dev-dependencies]
anyhow = "1.0"
env_logger = "0.11"
clap = { version = "3.2", features = ["derive"] }
tokio = { version = "1.17.0", features = [
    "io-std",
    "io-util",
    "rt-multi-thread",
    "time",
    "net",
    "sync",
    "macros",
] }
rand = "0.8.5"
shell-escape = "0.1"
# t8-B1: termion + tokio-fd are Unix-only TTY helpers used by the
# `interactive` example binary. Gating them to `cfg(unix)` lets the
# library test suite compile on Windows (the example itself remains
# Unix-only). No production dependency is affected.

[target.'cfg(unix)'.dev-dependencies]
tokio-fd = "0.3"
termion = "2"
ratatui = "0.26.0"

[package.metadata.docs.rs]
features = ["openssl"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openssl = { workspace = true, optional = true }
russh-sftp = "2.0.5"
tokio = { workspace = true }
