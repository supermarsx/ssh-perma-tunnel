# Minimal spt config — single profile, single local TCP forward.
# See spec.md §8.1 for the canonical layout.
version = 1

# -----------------------------------------------------------------------------
# Embedded auto-updater — OFF BY DEFAULT.
# -----------------------------------------------------------------------------
# Uncomment the block below to enable. See `docs/updater.md` for the full
# schema reference and `examples/updater.toml` for a fully annotated config.
# Manual `spt update check / status` still work without the block; the
# background polling thread is only spawned when `[updater].enabled = true`.
#
# [updater]
# enabled  = true
# mode     = "warn"             # off | check | warn | auto
# schedule = "0 6 * * *"        # 5-field cron (UTC); or `interval = "24h"`
# source   = "github"           # github | url | static
# [updater.verify]
# require_minisign = true
# minisign_pubkey  = "/etc/spt/minisign.pub"

[[profiles]]
name = "minimal"
enabled = true
protocol = "ssh2"
host = "bastion.example.com"
port = 22
user = "alice"

[profiles.auth]
method = "agent"

[profiles.trust]
mode = "known_hosts"
# Point at an existing OpenSSH known_hosts. On Unix the standard location is
# `~/.ssh/known_hosts`; on Windows it's `%USERPROFILE%\.ssh\known_hosts`.
known_hosts_file = "~/.ssh/known_hosts"
strict = true
# accept_new = true   # uncomment for trust-on-first-use against the file above

[[profiles.forwards]]
name = "web"
type = "local"
transport = "tcp"
bind = "127.0.0.1:8080"
target = "service.internal:80"
target_resolve = "remote"
required = true
