# Codecov configuration for ssh-perma-tunnel.
#
# `project` status is the load-bearing gate; `patch` is informational only
# so a single under-covered PR does not block merges while the project is
# still ramping its baseline. Tighten thresholds once a stable baseline is
# established.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false
    patch:
      default:
        target: auto
        threshold: 5%
        informational: true

ignore:
  - "**/tests/**"
  - "**/testing.rs"
  - "**/build.rs"

comment:
  layout: "header, diff, files"
  behavior: default
