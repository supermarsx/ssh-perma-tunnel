[package]
name = "spt-ssh3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "SSH3 backend for spt built on QUIC, rustls, and HTTP/3."

[lints]
workspace = true

[features]
default = []
# Exposes the `testing` module: Ssh3TestServer + fixtures. Pulls in `rcgen` as
# an optional non-dev dep so downstream test crates can reuse the harness.
# Implies `server` so the in-repo responder is available to test rigs and the
# existing e2e harness without separately enabling it.
testing = ["dep:rcgen", "server"]
# Promotes the in-repo SSH3 server end (`Ssh3Server`/`Ssh3ServerAcl`) out of the
# `testing` gate so a production `spt ssh3-serve` subcommand can drive it. The
# base feature adds NO new external dependency — server-side TLS uses
# operator-supplied cert+key PEM files via the rustls/rustls-pemfile crates
# already present. Dev-mode self-signed certificate generation (rcgen) lives
# behind the separate `server-selfsigned` opt-in below.
server = []
# Opt-in dev-mode `--self-signed` certificate generation for the server. Pulls
# in `rcgen` (already an optional dep for `testing`); kept OUT of the default
# `server` build so production server binaries never link rcgen.
server-selfsigned = ["server", "dep:rcgen"]
# Opt-in gate for Criterion benchmarks. This keeps `cargo test --all-targets`
# from executing harness-free benches during normal test gates.
bench = []

[dependencies]
spt-core = { workspace = true }
spt-protocol = { workspace = true }
# Forwarding toolkit: reuse the SAME rate/idle/bind/UDP-flow primitives the
# ssh2 backend consumes (TokenBucket / RateGate / ConnectionGate /
# copy_bidirectional_throttled_idle / bind_with_policy / UdpFlowTable) so ssh3
# forwards honour the per-forward limit surface identically. This is an internal
# workspace crate already in the lock (via spt-ssh2/spt-bin), so it only adds a
# dependency *edge* — no new external crate version.
spt-forward = { workspace = true }
spt-auth = { workspace = true }
spt-trust = { workspace = true }
spt-secrets = { workspace = true }
spt-key = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
bytes = "1"
dashmap = { workspace = true }

# Real SSH3 transport (QUIC + HTTP/3 + rustls).
quinn = { workspace = true }
# The `aws_lc_rs` provider adds the TLS-1.3 hybrid post-quantum kx group
# `X25519MLKEM768` (the `ring` provider has none). It is enabled ONLY for the
# ssh3 QUIC handshake via a *per-config* provider (see `src/tls.rs`); `ring`
# stays the process-global `install_default()` provider for status-api / syslog
# / reqwest. rustls's `aws_lc_rs` feature pulls `aws-lc-rs/prebuilt-nasm`, so the
# Windows x86_64 build needs no NASM install, and `aws-lc-sys` is ALREADY a
# normal dependency of the release binary via russh/spt-ssh2 — so this only turns
# on a rustls feature over an already-built crate (no new C toolchain cost).
rustls = { workspace = true, features = ["aws_lc_rs"] }
rustls-native-certs = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = { workspace = true }
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
http = "1"
base64 = { workspace = true }
sha2 = { workspace = true }
x509-parser = { workspace = true }
ssh-key = { workspace = true }
signature = "2"
serde_json = { workspace = true }
rand = { workspace = true }
rcgen = { version = "0.13", optional = true }

# Self dev-dep so `cargo test`/`cargo test --workspace` activates
# `spt-ssh3/testing` for THIS crate's own integration suites
# (`tests/uds_forward.rs`, `serve_endpoint.rs`, `e2e_forward.rs`, all
# `#![cfg(feature = "testing")]`). Without it, those SSH-over-QUIC security
# suites only compiled when a sibling (`tests/Cargo.toml`) happened to enable
# the feature; removing that single edge would silently drop them to 0 tests.
# Mirrors the spt-ftp-translator / spt-winevent / spt-remote-config idiom.
[dev-dependencies]
spt-ssh3 = { path = ".", features = ["testing"] }
tracing-test = "0.2"
tokio = { workspace = true }
serde_json = { workspace = true }
rcgen = "0.13"
criterion = { workspace = true }

[[bench]]
name = "wire"
path = "benches/wire.rs"
harness = false
required-features = ["bench"]
