[package]
name = "spt-ssh3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "SSH3 backend for spt built on QUIC, rustls, and HTTP/3."

[lints]
workspace = true

[features]
default = []
# Exposes the `testing` module: Ssh3TestServer + fixtures. Pulls in `rcgen` as
# an optional non-dev dep so downstream test crates can reuse the harness.
# Implies `server` so the in-repo responder is available to test rigs and the
# existing e2e harness without separately enabling it.
testing = ["dep:rcgen", "server"]
# Promotes the in-repo SSH3 server end (`Ssh3Server`/`Ssh3ServerAcl`) out of the
# `testing` gate so a production `spt ssh3-serve` subcommand can drive it. The
# base feature adds NO new external dependency — server-side TLS uses
# operator-supplied cert+key PEM files via the rustls/rustls-pemfile crates
# already present. Dev-mode self-signed certificate generation (rcgen) lives
# behind the separate `server-selfsigned` opt-in below.
server = []
# Opt-in dev-mode `--self-signed` certificate generation for the server. Pulls
# in `rcgen` (already an optional dep for `testing`); kept OUT of the default
# `server` build so production server binaries never link rcgen.
server-selfsigned = ["server", "dep:rcgen"]
# Opt-in gate for Criterion benchmarks. This keeps `cargo test --all-targets`
# from executing harness-free benches during normal test gates.
bench = []

[dependencies]
spt-core = { workspace = true }
spt-protocol = { workspace = true }
spt-auth = { workspace = true }
spt-trust = { workspace = true }
spt-secrets = { workspace = true }
spt-key = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
bytes = "1"
dashmap = { workspace = true }

# Real SSH3 transport (QUIC + HTTP/3 + rustls).
quinn = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = { workspace = true }
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
http = "1"
base64 = { workspace = true }
sha2 = { workspace = true }
x509-parser = { workspace = true }
ssh-key = { workspace = true }
signature = "2"
serde_json = { workspace = true }
rand = { workspace = true }
rcgen = { version = "0.13", optional = true }

[dev-dependencies]
tracing-test = "0.2"
tokio = { workspace = true }
serde_json = { workspace = true }
rcgen = "0.13"
criterion = { workspace = true }

[[bench]]
name = "wire"
path = "benches/wire.rs"
harness = false
required-features = ["bench"]
