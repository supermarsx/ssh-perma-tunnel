[package]
name = "spt-ssh3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "SSH3 backend for spt built on QUIC, rustls, and HTTP/3."

[lints]
workspace = true

[features]
default = []
# Exposes the `testing` module: Ssh3TestServer + fixtures. Pulls in `rcgen` as
# an optional non-dev dep so downstream test crates can reuse the harness.
testing = ["dep:rcgen"]

[dependencies]
spt-core = { workspace = true }
spt-protocol = { workspace = true }
spt-auth = { workspace = true }
spt-trust = { workspace = true }
spt-key = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
bytes = "1"
dashmap = { workspace = true }

# Real SSH3 transport (QUIC + HTTP/3 + rustls).
quinn = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = { workspace = true }
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
http = "1"
base64 = { workspace = true }
sha2 = { workspace = true }
x509-parser = { workspace = true }
ssh-key = { workspace = true }
signature = "2"
serde_json = { workspace = true }
rand = { workspace = true }
rcgen = { version = "0.13", optional = true }

[dev-dependencies]
tracing-test = "0.2"
tokio = { workspace = true }
serde_json = { workspace = true }
rcgen = "0.13"
