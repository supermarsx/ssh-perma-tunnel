[package]
name = "spt-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Address parsing, interface enumeration, and bind policy for spt."

[lints]
workspace = true

[features]
testing = []

[dependencies]
spt-core = { workspace = true }
tokio = { workspace = true }
socket2 = { workspace = true }
if-addrs = { workspace = true }
ipnet = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
caps = { workspace = true }

[target.'cfg(windows)'.dependencies]
# `windows` is inherited from the workspace; spt-net additionally needs the
# IP Helper routing-table APIs (GetIpForwardTable2 / GetBestRoute2) and the
# WinSock/Ndis sockaddr + LUID types for `gateway.rs`. Cargo unions these
# feature flags with the workspace-level set — no new dependency is added.
windows = { workspace = true, features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
