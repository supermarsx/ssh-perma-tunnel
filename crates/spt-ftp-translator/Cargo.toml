[package]
name = "spt-ftp-translator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Passive-only FTP server that translates RFC 959/3659 verbs into spt-sftp calls."

# t6-e6 — this crate is intentionally NOT registered in `[workspace.members]`.
# That edit is owned by t6-Bwire per the t6.md phasing table
# ("Workspace.members append"). The crate is referenced via
# `[workspace.dependencies]` so any in-workspace consumer (notably
# `spt-bin`/`spt-cli` once Bwire wires `Command::Ftp`) compiles it under
# `--locked` without bumping the lockfile.

[lints]
workspace = true

[features]
default = []
# Exposes the in-process mock `SftpFactory` so downstream crates can drive
# the translator without an SSH transport. Pulls in `spt-sftp/testing`.
testing = ["spt-sftp/testing"]

[dependencies]
spt-core = { workspace = true }
spt-sftp = { workspace = true }
# t7-A8: Ssh2SftpFactory opens a real russh SFTP session per FTP user
# via `Ssh2Protocol::connect_sftp`. The dep is workspace-managed and
# already in the lockfile via spt-bin/spt-supervisor, so adding it here
# does not trigger `cargo update`.
spt-ssh2 = { workspace = true }
spt-auth = { workspace = true }
spt-protocol = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
# Real TLS — rustls/tokio-rustls/rustls-pemfile are all in Cargo.lock via the
# workspace's existing status-API / syslog-TLS / lettre consumers. Adding the
# direct dep here does NOT trigger `cargo update`.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = { workspace = true }

[dev-dependencies]
# Self dev-dep enables this crate's own `testing` feature for its integration
# tests, mirroring the spt-auth-sspi / spt-dns / spt-obfs convention. Without
# it, `path_traversal.rs` (`#![cfg(feature = "testing")]`) compiled to a 0-test
# binary and `translator.rs` (`required-features = ["testing"]`) was skipped
# entirely under the default `cargo test --workspace` CI invocation — the
# FTP-layer path-traversal security suite never ran. The feature unifies ON for
# this crate's test build (and the workspace build) so those suites now execute.
spt-ftp-translator = { path = ".", version = "0.26.1", features = ["testing"] }
tokio = { workspace = true }
tempfile = { workspace = true }
spt-sftp = { workspace = true, features = ["testing"] }
# t7-A8: drive a real russh server (RusshTestServer) from
# tests/translator.rs to validate Ssh2SftpFactory session pooling.
spt-ssh2 = { workspace = true, features = ["testing"] }
spt-secrets = { workspace = true }
# Self-signed test cert/key for the AUTH TLS handshake test (mirrors
# `spt-status-api`'s tls integration test posture).
rcgen = { workspace = true }
# Client-side TLS verifier for the AUTH TLS round-trip test (mirrors
# `spt-status-api`'s integration test posture).
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# t7-A8: inline russh SSH2 server + SFTP-subsystem bridge for the
# `ssh2_sftp_factory_pools_sessions` integration test. Each dep is
# already in the workspace lockfile via spt-ssh2 / spt-sftp.
russh = { workspace = true }
russh-sftp = { workspace = true }
async-trait = { workspace = true }
# rand 0.10 supplies the rand_core-0.10 `CryptoRng` that russh 0.61's
# `ssh_key::PrivateKey::random` host-keygen requires (workspace rand is 0.8).
# Already in the lock via spt-ssh2's `rand010` alias — no `cargo update`.
# Replaces the removed `russh-keys 0.46` dep (RUSTSEC-2026-0154/-0153).
rand010 = { package = "rand", version = "0.10" }

[[test]]
name = "translator"
required-features = ["testing"]
