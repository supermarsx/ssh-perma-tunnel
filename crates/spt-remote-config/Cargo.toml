[package]
name = "spt-remote-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Remote configuration fetch with HTTPS pinning for spt."

[lints]
workspace = true

[dependencies]
spt-core = { workspace = true }
spt-config = { workspace = true }
spt-state = { workspace = true }
spt-trust = { workspace = true }

async-trait = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

# Optional deps used solely by the `testing` feature: an in-process HTTPS
# server backed by axum + tokio-rustls + a self-signed cert from rcgen.
axum = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"], optional = true }
hyper = { version = "1", features = ["http1", "http2", "server"], optional = true }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "server-auto", "tokio", "service"], optional = true }
tower = { version = "0.5", optional = true }

[features]
# Public test facilities: synthetic results + an in-process HTTPS rig
# (`AxumHttpsServer`) backed by a self-signed rcgen cert.
testing = ["dep:axum", "dep:tokio-rustls", "dep:rustls", "dep:rustls-pemfile", "dep:rcgen", "dep:hyper", "dep:hyper-util", "dep:tower"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "net"] }
axum = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "server-auto", "tokio", "service"] }
tower = "0.5"
