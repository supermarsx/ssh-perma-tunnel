[package]
name = "spt-winevent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Windows Event Log integration for spt."

[lints]
workspace = true

[dependencies]
spt-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

[features]
testing = []

[target.'cfg(windows)'.dependencies]
# Workspace `windows` feature set already includes Win32_System_EventLog +
# Win32_Foundation; add Registry locally for HKLM source registration.
windows = { version = "0.58", features = [
    "Win32_System_EventLog",
    "Win32_System_Registry",
    "Win32_Foundation",
    "Win32_Security",
] }
# t8-D2: replace two `slice::from_raw_parts(_.cast::<u8>(), …)` unsafe blocks
# in `imp.rs` (registry payload encoding) with safe `IntoBytes` calls.
zerocopy = { workspace = true }

[dev-dependencies]
# Self dev-dep enables the `testing` feature (MockEventLogBackend + fault
# injection) for this crate's integration tests, mirroring the spt-auth-sspi /
# spt-dns / spt-obfs convention. Without it, `tests/mock_backend.rs`
# (`#![cfg(feature = "testing")]`) compiled to a 0-test binary under the default
# `cargo test --workspace` CI invocation. The feature now unifies ON.
spt-winevent = { path = ".", version = "0.26.1", features = ["testing"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
