[package]
name = "spt-winevent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Windows Event Log integration for spt."

[lints]
workspace = true

[dependencies]
spt-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Workspace `windows` feature set already includes Win32_System_EventLog +
# Win32_Foundation; add Registry locally for HKLM source registration.
windows = { version = "0.58", features = [
    "Win32_System_EventLog",
    "Win32_System_Registry",
    "Win32_Foundation",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
