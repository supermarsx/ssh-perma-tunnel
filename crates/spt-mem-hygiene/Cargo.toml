[package]
name = "spt-mem-hygiene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Best-effort process memory hygiene / hardening helpers for spt."

[lints]
workspace = true

[features]
# Opt-in on macOS to enable `ptrace(PT_DENY_ATTACH)`. Default OFF because it
# can break notarization / debugging tools. See docs/security.md.
macos-anti-debug = []

[dependencies]
serde = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Foundation",
] }

[dev-dependencies]
serde_json = { workspace = true }
