[package]
name = "spt-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Service manager integrations (systemd, launchd, SCM, etc) for spt."

[lints]
workspace = true

[dependencies]
spt-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
csv = "1.3"

[features]
testing = []

[target.'cfg(unix)'.dependencies]
# `geteuid()` for resolving the launchd agent `gui/<uid>` domain (E7-F8).
# The workspace `nix` already enables the `user` feature.
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-service = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# Self dev-dep so the `#![cfg(feature = "testing")]` integration suite
# (`tests/windows_scm_mock.rs`) is self-activating. Without this the `testing`
# feature is enabled only by a sibling (spt-diagnostics) dev-dep edge; if that
# edge is removed the suite silently compiles to 0 tests under a green CI.
# Mirrors the spt-ftp-translator / spt-remote-config convention.
spt-service = { path = ".", features = ["testing"] }
