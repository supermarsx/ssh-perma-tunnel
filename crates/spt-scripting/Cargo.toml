[package]
name = "spt-scripting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Scriptable tunnelling hooks for spt. Sandboxed Rhai engine with per-hook event payloads (pre_connect / post_connect / on_forward_state / on_disconnect / on_event)."

[lints]
workspace = true

[dependencies]
spt-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# t7-A2: real rhai engine — replaces the t6-e7 contract-enforcing stub.
# Pinned to 1.19 (MSRV 1.66, well within workspace MSRV 1.85). `default-features =
# false` keeps the dep surface minimal; we opt into `std`, `sync` (so the
# engine is `Send + Sync` and can live in an `Arc<ScriptEngine>` shared
# across sessions), and `serde` (the bridge that converts our
# `serde::Serialize` event payloads to `rhai::Dynamic` via
# `rhai::serde::to_dynamic`). No filesystem / module-loading features.
rhai = { version = "1.19", default-features = false, features = ["std", "sync", "serde"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
