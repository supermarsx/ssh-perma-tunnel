[package]
name = "spt-secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Secret resolver, vault, and OS keychain integration for spt."

[lints]
workspace = true

[features]
testing = []

[dependencies]
spt-core = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
# `zeroize` (an optional feature of aes-gcm, not a new dependency) wipes the
# derived GHASH key material on drop so no AES-GCM key-schedule residue lingers
# in freed heap after a cipher is dropped.
aes-gcm = { workspace = true, features = ["zeroize"] }
argon2 = { workspace = true }
keyring = { workspace = true, features = ["apple-native", "windows-native", "sync-secret-service", "linux-native"] }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
directories = { workspace = true }
atomicwrites = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `term` is required for `nix::sys::termios` used by the passphrase
# reader to disable terminal echo. The workspace `nix` already enables
# `signal` (used by the SIGINT handler), `fs`, `user`, and `mman`.
nix = { workspace = true, features = ["term"] }
# `libc` is used by the SIGINT async-signal-safe restore path
# (`libc::signal` / `libc::raise`) — `nix` does not expose
# `signal(2)`/`raise(3)` directly.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = { workspace = true }
