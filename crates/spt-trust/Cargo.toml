[package]
name = "spt-trust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "known_hosts, SHA-256 host pinning, and TLS pin verification for spt."

[lints]
workspace = true

[features]
testing = ["spt-key/testing"]
# Opt-in gate for Criterion benchmarks. Keeps `cargo test --all-targets` from
# running harness-free benches as part of the normal test gates.
bench = []

[dependencies]
spt-core = { workspace = true }
spt-key = { workspace = true }
ssh-key = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
x509-parser = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-native-certs = { workspace = true }
webpki-roots = { workspace = true }
tokio-rustls = { workspace = true }
atomicwrites = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
spt-key = { workspace = true, features = ["testing"] }
# Already in workspace Cargo.lock via spt-observability/spt-remote-config; reused
# here in tests to mint self-signed certs for `TlsPin::verify` coverage.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
criterion = { workspace = true }
# Used by `chain_depth` tests to round-trip the cap through TOML.
toml = { workspace = true }

[[bench]]
name = "match_verify"
path = "benches/match_verify.rs"
harness = false
required-features = ["bench"]
