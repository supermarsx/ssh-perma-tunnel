[package]
name = "spt-forward"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Local/remote TCP and UDP forwarders for spt."

[lints]
workspace = true

[features]
default = []
# Exposes in-memory MockTunnelProtocol/MockTunnelSession fixtures for downstream
# crate tests (used by spt-supervisor's test suite).
testing = []

[dependencies]
spt-core = { workspace = true }
spt-config = { workspace = true }
spt-protocol = { workspace = true }
spt-auth = { workspace = true }
spt-net = { workspace = true }
spt-state = { workspace = true }

tokio = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
bytes = "1"
rand = { workspace = true }
socket2 = { workspace = true }
humantime = { workspace = true }
ipnet = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
