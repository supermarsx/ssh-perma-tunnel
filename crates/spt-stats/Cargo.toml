[package]
name = "spt-stats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Rolling counters, sliding windows, and session tables for spt."

[features]
default = []
# Public test helpers in `spt_stats::testing`. Off by default so production
# builds don't carry the extra fixtures.
testing = []
# Opt-in gate for Criterion benchmarks. Keeps `cargo test --all-targets`
# from executing harness-free benches during normal test gates.
bench = []

[dependencies]
spt-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "aggregation"
path = "benches/aggregation.rs"
harness = false
required-features = ["bench"]
