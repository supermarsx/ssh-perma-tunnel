[package]
name = "spt-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Authentication method types and validation for spt."

[lints]
workspace = true

[features]
testing = ["dep:axum"]
# Enables shelling out to the `ykman` CLI for YubiKey OATH-TOTP responder
# answers. Without this feature, `KbiAnswer::YubikeyOath` evaluation returns
# `Error::UnsupportedPlatform` cleanly.
yubikey = []

[dependencies]
spt-core = { workspace = true }
spt-secrets = { workspace = true }
spt-trust = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }
secrecy = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
rand = { workspace = true }
# TOTP (RFC 6238) hand-rolled on workspace primitives.
hmac = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
# Regex for per-prompt keyboard-interactive responder matching (§9.12).
regex = { workspace = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
