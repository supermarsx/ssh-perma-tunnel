[package]
name = "spt-sftp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "SFTP client built on russh-sftp with recursive transfer, resume, bandwidth limiting, and checksum verification."

[lints]
workspace = true

[features]
default = []
# Exposes the in-process [`mock::MockSftpServer`] harness so downstream
# crates (notably the spt-bin CLI tests) can wire SFTP fixtures without
# building an SSH transport.
testing = []
# Linux FUSE backend. Pulls in `fuser` which links libfuse via pkg-config
# at build time; default-off so workspace builds on hosts without
# libfuse-dev installed. The optional `fuser`/`libc` deps are scoped to
# `cfg(target_os = "linux")` so enabling the feature on non-Linux hosts
# is a no-op (the stub `Filesystem` impl is selected instead).
mount-fuse = ["dep:fuser", "dep:libc"]
# Windows userspace-filesystem backend, wired to the **Dokan** (Dokany2)
# Rust binding. `winfsp 0.10` was initially considered but that crate is
# GPL-3.0, which the workspace's non-GPL license policy rejects. The
# implementation uses the MIT-licensed `dokan` / `dokan-sys` crates
# instead (the bundled Dokany2 C source is LGPL-3.0 and built into
# `dokan2.dll`; LGPL allows dynamic linking from non-LGPL code).
#
# Runtime requirement: install the Dokany2 driver and userspace library
# (`choco install dokany2 -y`). The `dokan-sys` build script picks up the
# `DokanLibrary2_LibraryPath_x64` env var the installer sets and links
# against the installed DLL; without that env var the build script falls
# back to compiling the vendored LGPL source itself.
#
# Build requirement: a C compiler is needed even when Dokany is
# pre-installed — `dokan-sys/build.rs` always compiles a tiny version
# probe (`generate_version.c`). Install MSVC build tools on the CI host.
mount-winfs = ["dep:dokan", "dep:dokan-sys", "dep:widestring", "dep:winapi"]
# Back-compat alias for the original t7-A6 feature name. Pre-existing
# CLI / packaging surfaces that referenced `mount-winfsp` keep working
# without churn; the new code lives behind `mount-winfs`.
mount-winfsp = ["mount-winfs"]

[dependencies]
spt-core = { workspace = true }
russh-sftp = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
futures = { workspace = true }

# Linux FUSE session loop. Gated behind `mount-fuse` so workspace builds on
# hosts without `libfuse-dev` installed; the platform `cfg` keeps the dep
# off non-Linux targets entirely. `fuser 0.15` MSRV is 1.74 (workspace
# MSRV 1.85 is well above).
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.15", optional = true }
libc = { version = "0.2", optional = true }

# Windows Dokan / Dokany2 backend (t7-P2). MIT-licensed Rust crates; the
# bundled Dokany C source is LGPL-3.0 and built into `dokan2.dll`. The
# platform `cfg` keeps these deps off non-Windows targets entirely — the
# `dokan-sys` build script rejects non-x86/x86_64 architectures with a
# panic, and the C-toolchain probe is Windows-only. `dokan-sys` and
# `dokan` both declare `rust-version: unknown` but build cleanly on
# stable Rust 1.85 (workspace MSRV); their only build-time prereq is a C
# compiler (MSVC build tools) plus optionally a pre-installed Dokany2
# (set `DokanLibrary2_LibraryPath_x64` to skip the in-tree LGPL build).
[target.'cfg(all(target_os = "windows", any(target_arch = "x86", target_arch = "x86_64")))'.dependencies]
dokan = { version = "0.3", optional = true }
dokan-sys = { version = "0.3", optional = true }
widestring = { version = "0.4", optional = true }
winapi = { version = "0.3", optional = true, features = [
    "minwinbase",
    "ntdef",
    "ntstatus",
    "winnt",
] }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
# Back-compat assertion: `spt-ssh2::sftp::SftpClient` re-exports through the
# shim we left at `crates/spt-ssh2/src/sftp.rs`. Dev-dep only.
spt-ssh2 = { workspace = true }

[[test]]
name = "ops"
required-features = ["testing"]

[[test]]
name = "mount"
required-features = ["testing"]

[[test]]
name = "recursive_traversal"
required-features = ["testing"]
