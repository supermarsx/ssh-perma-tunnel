[package]
name = "spt-benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Benchmark drivers and result schemas for spt."

[lints]
workspace = true

[dependencies]
spt-core = { workspace = true }
spt-state = { workspace = true }
# t8-C3: comparative-bench harness needs the chaos proxy to apply latency/loss
# between the comparator (ssh / autossh / spt) and the SSH server.
spt-chaos-proxy = { workspace = true }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
csv = "1"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "net", "io-util", "time", "macros", "rt-multi-thread"] }
tracing = { workspace = true }
chrono = { workspace = true }
# t8-C3: argument parser for the `matrix_cell` binary that drives one cell
# of the 54-cell comparative matrix.
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "time", "net", "sync"] }
spt-forward = { workspace = true }
hickory-resolver = { workspace = true }

[features]
# Optional integration test against a real `hickory-resolver`. Off by default
# because it needs network/loopback DNS reachable.
hickory-test = []
# Public test facilities: reusable mocks, fixtures, and synthetic builders.
testing = []
