[package]
name = "spt-diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Structured diagnostic checks and bundle builder for spt."

[lints]
workspace = true

[dependencies]
spt-core = { workspace = true }
spt-config = { workspace = true }
spt-state = { workspace = true }
spt-secrets = { workspace = true }
spt-firewall = { workspace = true }
spt-service = { workspace = true }
# E8-F6: derive the expected MCP tool/resource counts from the canonical
# registries (`ALL_TOOL_NAMES` / `ResourceRegistry`) instead of hardcoding 31.
spt-mcp = { workspace = true }
spt-ssh2 = { workspace = true }
# E8-F8: query russh's real algorithm catalog (Preferred::DEFAULT + the
# `TryFrom<&str>` name parsers) so the ssh2 diagnostic can never drift from
# the linked russh version instead of carrying a hand-maintained alg list.
russh = { workspace = true }
spt-auth = { workspace = true }
spt-trust = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
flate2 = "1"
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
secrecy = { workspace = true }
tar = "0.4"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "macros", "rt-multi-thread", "net", "time", "sync"] }
tracing = { workspace = true }
chrono = { workspace = true }

[features]
# Public test facilities: synthetic Check/Report builders + FakeDiagnosticContext.
# Pulls in sibling crates' `testing` features for ready-wired fakes.
testing = ["spt-firewall/testing", "spt-service/testing"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "net", "time", "process", "sync"] }
# Enable sibling crates' `testing` modules for the in-crate `#[cfg(test)]` path
# of `src/testing.rs` so `cargo test -p spt-diagnostics` (without explicit
# `--features testing`) still compiles.
spt-firewall = { workspace = true, features = ["testing"] }
spt-service = { workspace = true, features = ["testing"] }
