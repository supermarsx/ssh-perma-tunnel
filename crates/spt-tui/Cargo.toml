[package]
name = "spt-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Terminal UI profile configurator for spt."

[features]
testing = []
# Enables the real `arboard` clipboard backend. Disabled in headless CI so
# the wider workspace build does not pull `wl-clipboard-rs` / `xcb` etc.
# When disabled, `ClipboardWrapper` is a graceful no-op (logs a warning).
clipboard = ["dep:arboard"]
default = ["clipboard"]

[lints]
workspace = true

[dependencies]
spt-core = { workspace = true }
spt-config = { workspace = true }
spt-auth = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
unicode-width = "0.1"
toml_edit = { workspace = true }
toml = { workspace = true }
# `secrecy::SecretBox` is the cross-workspace type used to hand secret bytes
# into the redacted-field yank path without an extra plaintext clone.
secrecy = { workspace = true }
# Pinned to 3.4 (MSRV 1.67.1, well under workspace MSRV 1.83). 3.4 added
# `Clipboard::clear()`; we use `set_text("")` for portability across builds
# without `image-data`. `default-features = false` drops the image/X11 surface.
arboard = { version = "=3.6.1", default-features = false, optional = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
