[package]
name = "spt-auth-sspi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "GSSAPI/Kerberos/SSPI/NTLM provider backends behind the AuthMethod::Gssapi and AuthMethod::Sspi variants (gssapi-with-mic, RFC 4462)."

[lints]
workspace = true

[features]
default = []
# Exposes the in-process [`mock::MockGssProvider`] for downstream tests that
# need to drive the `gssapi-with-mic` state machine without a real KDC.
testing = []

[dependencies]
spt-core = { workspace = true }
spt-auth = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }

# t7-A3: real backends.
#
# Target-gated to keep the build hermetic on the opposite platform:
#   * Windows pulls only `sspi` (which compiles purely against Win32 SSPI).
#   * Unix pulls only `cross-krb5` (which wraps libgssapi-sys; that
#     transitive crate requires krb5 headers at build time and would fail
#     on Windows).
#
# Version selection: spec called for `sspi = "0.15"` (fallback `=0.14`) and
# `cross-krb5 = "0.4"`. The latest `sspi 0.21` declares MSRV 1.89 (> 1.85);
# `sspi 0.15.x` and `0.14.x` declare no MSRV in metadata and build cleanly
# on 1.85, so we pin to the `0.15` major. `cross-krb5 0.4.x` declares no
# MSRV and is the current latest. Both pinned with `=` per the t7
# milestone's "documented dep" policy.

[target.'cfg(windows)'.dependencies]
sspi = { version = "=0.15.12", default-features = false }

[target.'cfg(unix)'.dependencies]
# t7-A3 deviation from spec: the spec called for `cross-krb5 0.4`, but
# `cross-krb5 0.4.2` only exposes `wrap`/`unwrap`, not `gss_get_mic` /
# `gss_verify_mic`. SSH `gssapi-with-mic` (RFC 4462 §3.5) requires the MIC
# token form (RFC 2743), which is wire-distinct from a non-encrypting Wrap
# token — `wrap(false, ..)` is NOT a valid MIC substitute and a real OpenSSH
# server rejects the conflation. We use `libgssapi 0.9` directly instead;
# `cross-krb5` was going to pull it transitively in any case, so the
# dependency-graph delta is zero. See `.orchestration/logs/t7-A3.md`.
libgssapi = { version = "=0.9.1", default-features = false }

[dev-dependencies]
# The `testing` feature is activated for integration tests via the dev-dep
# self-reference convention used elsewhere in the workspace.
spt-auth-sspi = { path = ".", version = "0.26.1", features = ["testing"] }
tokio = { workspace = true }
serde_json = { workspace = true }
