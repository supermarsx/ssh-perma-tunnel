[package]
name = "spt-auth-sspi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "GSSAPI/Kerberos/SSPI/NTLM provider backends behind the AuthMethod::Gssapi and AuthMethod::Sspi variants (gssapi-with-mic, RFC 4462)."

[lints]
workspace = true

[features]
default = []
# Exposes the in-process [`mock::MockGssProvider`] for downstream tests that
# need to drive the `gssapi-with-mic` state machine without a real KDC.
testing = []

[dependencies]
spt-core = { workspace = true }
spt-auth = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# NOTE: real `sspi` / `cross-krb5` / `libgssapi` crates are deliberately NOT
# listed. They are not present in `Cargo.lock`, so under the workspace
# `--locked` + no-`cargo update` policy they cannot be activated. This crate
# ships the trait surface, configuration types, principal parser, mock
# provider, and a documented `UnsupportedBackend` fallback for every OS until
# the lockfile is updated in a future executor (see ../../.orchestration/logs/t6-e9.md).

[dev-dependencies]
# The `testing` feature is activated for integration tests via the dev-dep
# self-reference convention used elsewhere in the workspace.
spt-auth-sspi = { path = ".", features = ["testing"] }
tokio = { workspace = true }
serde_json = { workspace = true }
