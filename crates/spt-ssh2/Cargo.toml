[package]
name = "spt-ssh2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "SSH2 backend for spt — pure-Rust russh transport."

[lints]
workspace = true

[features]
default = []
# Exposes the `testing` module: MockSsh2Session, RusshTestServer, fake_session().
testing = []

[dependencies]
spt-core = { workspace = true }
spt-protocol = { workspace = true }
spt-auth = { workspace = true }
spt-auth-sspi = { workspace = true }
spt-key = { workspace = true }
spt-trust = { workspace = true }
spt-net = { workspace = true }
spt-secrets = { workspace = true }
spt-sftp = { workspace = true }
spt-scripting = { workspace = true }
spt-obfs = { workspace = true }

tokio = { workspace = true }
async-trait = { workspace = true }
ssh-key = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
bytes = "1"
parking_lot = { workspace = true }
serde = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
russh = { workspace = true }
russh-keys = { workspace = true }
russh-sftp = { workspace = true }
# Used directly by `agent.rs` to construct sign-request payloads; russh-keys
# does not re-export `CryptoVec`. Version is already in the lockfile via
# russh's transitive depgraph.
russh-cryptovec = "0.7"
regex = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
russh = { workspace = true }
russh-keys = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }

# Agent + GSSAPI / SSPI dispatch integration tests (t7-A1).
[[test]]
name = "agent"
required-features = ["testing"]

[[test]]
name = "russh_basic"
required-features = ["testing"]

[[test]]
name = "russh_backend"
required-features = ["testing"]

# OpenSSH-against-russh interop tests (Unix-only at runtime).
[[test]]
name = "openssh_interop"
required-features = ["testing"]

# UDS forwarding integration tests.
[[test]]
name = "uds_forward"
required-features = ["testing"]

# t7-Phase0: 3-hop russh-native multi-hop chain integration test.
[[test]]
name = "multi_hop_three_hops"
required-features = ["testing"]
