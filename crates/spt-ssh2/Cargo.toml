[package]
name = "spt-ssh2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "SSH2 backend for spt — pure-Rust russh transport."

[lints]
workspace = true

[features]
default = []
# Exposes the `testing` module: MockSsh2Session, RusshTestServer, fake_session().
# Pulls in `rand` 0.10 for the embedded test server's host-key generation
# (russh 0.61's `ssh_key::PrivateKey::random` requires a rand_core-0.10
# `CryptoRng`, which the workspace's rand 0.8 does not provide).
testing = ["dep:rand010"]

[dependencies]
spt-core = { workspace = true }
spt-protocol = { workspace = true }
spt-forward = { workspace = true }
spt-auth = { workspace = true }
spt-auth-sspi = { workspace = true }
spt-key = { workspace = true }
spt-trust = { workspace = true }
spt-net = { workspace = true }
spt-secrets = { workspace = true }
spt-sftp = { workspace = true }
spt-scripting = { workspace = true }
spt-obfs = { workspace = true }

tokio = { workspace = true }
async-trait = { workspace = true }
# conn-wire: apply `[profiles.connection]` socket options (nodelay/keepalive) to
# the dialed stream. Already in the lock via tokio/mio's transitive graph, so
# this only adds a dependency *edge* (no new crate version).
socket2 = { workspace = true }
# Target-ACL CIDR matching for dynamic SOCKS forwards. Already in the lock via
# spt-net/spt-firewall, so this only adds a dependency *edge* (no new crate
# version).
ipnet = { workspace = true }
ssh-key = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
bytes = "1"
parking_lot = { workspace = true }
serde = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
# Serialize crash-safe TOFU known_hosts rewrites so concurrent first-use appends
# cannot overwrite each other's newly trusted host-key pins.
fs4 = { workspace = true }
russh = { workspace = true }
russh-sftp = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
# `testing`-feature-only: rand 0.10 supplies the rand_core-0.10 `CryptoRng`
# that russh 0.61's `ssh_key::PrivateKey::random` needs for the embedded
# `RusshTestServer` host key. Aliased so it coexists with the workspace's
# rand 0.8 (used by the dev-dependency test harness).
rand010 = { package = "rand", version = "0.10", optional = true }

[dev-dependencies]
# Self dev-dep so the eight `required-features = ["testing"]` integration-test
# targets below are self-activating under `cargo test --workspace`, rather than
# depending on an external dev-dep edge (spt-ftp-translator / the `tests` member)
# to turn on `spt-ssh2/testing`. Mirrors the spt-ftp-translator convention.
spt-ssh2 = { path = ".", features = ["testing"] }
tokio = { workspace = true }
russh = { workspace = true }
tempfile = { workspace = true }
# rand 0.10 (NOT the workspace 0.8), aliased identically to the optional
# `rand010` dependency above so cargo sees a single crate name. Supplies the
# rand_core-0.10 `CryptoRng` that russh 0.61's `ssh_key::PrivateKey::random`
# requires. Already in the lockfile via russh's transitive graph.
rand010 = { package = "rand", version = "0.10" }
async-trait = { workspace = true }

# Agent + GSSAPI / SSPI dispatch integration tests (t7-A1).
[[test]]
name = "agent"
required-features = ["testing"]

[[test]]
name = "russh_basic"
required-features = ["testing"]

[[test]]
name = "russh_backend"
required-features = ["testing"]

# OpenSSH-against-russh interop tests (Unix-only at runtime).
[[test]]
name = "openssh_interop"
required-features = ["testing"]

# UDS forwarding integration tests.
[[test]]
name = "uds_forward"
required-features = ["testing"]

# End-to-end data-plane regression tests through the real russh (ssh2)
# transport: byte-integrity at scale, half-close/EOF, throttle+idle (MED-3),
# and max_connections enforcement on a live local forward.
[[test]]
name = "ssh2_dataplane"
required-features = ["testing"]

# t7-Phase0: 3-hop russh-native multi-hop chain integration test.
[[test]]
name = "multi_hop_three_hops"
required-features = ["testing"]

# Wave A2: proxy-hop (SOCKS5 / HTTP CONNECT) dispatch via the kind-aware
# chained-session path.
[[test]]
name = "multi_hop_proxy_dispatch"
required-features = ["testing"]

# E8-F1: scripting lifecycle hooks fire on connect/forward/disconnect.
[[test]]
name = "scripting_hooks"
required-features = ["testing"]
