[package]
name = "spt-ssh2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "SSH2 backend for spt built on libssh2 (async-ssh2-lite)."

[lints]
workspace = true

[features]
default = []
# Uses libssh2's vendored OpenSSL backend. This enables ED25519 host-key
# interop on Windows, but stays opt-in so default Windows builds can use
# WinCNG without requiring a native Perl/OpenSSL toolchain.
vendored-openssl = ["async-ssh2-lite/vendored-openssl", "ssh2/vendored-openssl"]
# Exposes the `testing` module: MockSsh2Session, RusshTestServer, fake_session().
# Pulls in russh + russh-keys as optional non-dev deps so external test crates
# can reuse the harness without re-vendoring it.
testing = ["dep:russh", "dep:russh-keys"]

[dependencies]
spt-core = { workspace = true }
spt-protocol = { workspace = true }
spt-auth = { workspace = true }
spt-key = { workspace = true }
spt-trust = { workspace = true }
spt-net = { workspace = true }
spt-secrets = { workspace = true }

tokio = { workspace = true }
async-trait = { workspace = true }
async-ssh2-lite = { workspace = true }
ssh2 = { workspace = true }
ssh-key = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["pem", "pkcs8"] }
rsa = { version = "0.9", default-features = false, features = ["pem", "std"] }
secrecy = { workspace = true }
zeroize = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
bytes = "1"
parking_lot = { workspace = true }
serde = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
russh = { workspace = true, optional = true }
russh-keys = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
russh = { workspace = true }
russh-keys = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }

[[test]]
name = "russh_basic"
required-features = ["testing"]

# OpenSSH-against-libssh2 interop tests (Unix-only at runtime; Windows compiles
# but every test no-ops via `cfg_attr(target_os = "windows", ignore)`). Sidesteps
# the upstream russh-0.46 ↔ libssh2-WinCNG `-8 KEY_EXCHANGE_FAILURE` bug.
[[test]]
name = "openssh_interop"
required-features = ["testing"]

# Real-libssh2 interop tests against `RusshTestServer`. Requires
# `vendored-openssl` so libssh2 uses OpenSSL (which negotiates correctly with
# russh 0.46) instead of WinCNG. **Linux-only**; needs Perl + NASM on `PATH`
# to build the vendored OpenSSL. Do not run on Windows.
[[test]]
name = "russh_interop"
required-features = ["testing", "vendored-openssl"]
