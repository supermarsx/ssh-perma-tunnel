[package]
name = "spt-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Profile state machine, reconnect, and failover supervisor for spt."

[lints]
workspace = true

[features]
default = []
# Exposes the `testing` module: OrchestratorBuilder, RecordingConnector,
# wait_for_state, synthetic_stats_tick, plus re-exports of the existing
# Echo/Unavailable connectors and LiveReconnectTrigger.
testing = ["spt-forward/testing"]

[dependencies]
spt-core = { workspace = true }
spt-config = { workspace = true }
spt-protocol = { workspace = true }
spt-auth = { workspace = true }
spt-state = { workspace = true }
spt-stats = { workspace = true }
spt-forward = { workspace = true }

tokio = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
humantime = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
spt-forward = { workspace = true, features = ["testing"] }
