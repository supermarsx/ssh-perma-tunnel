[package]
name = "spt-events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Event bus, bindings, and notification sinks for spt."

[dependencies]
spt-core = { workspace = true }
spt-state = { workspace = true }
spt-secrets = { workspace = true }

tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
tracing = { workspace = true }
humantime = { workspace = true }

# Real transports
reqwest = { workspace = true, optional = true }
lettre = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[features]
default = ["transports"]
# Real network transports: lettre (SMTP), reqwest (HTTPS). Push is a plain
# HTTPS POST through reqwest; full RFC 8030 WebPush is deferred (see
# Cargo.toml comment on the `web-push` workspace dep).
transports = ["dep:reqwest", "dep:lettre", "dep:url"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
