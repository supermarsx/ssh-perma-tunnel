[package]
name = "spt-bin"
# Release artifacts are built as OS packages/installers from the workspace.
# This aggregate binary depends on internal crates that are not registry deps.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "spt — permanent SSH2/SSH3 tunnel CLI binary."

[[bin]]
name = "spt"
path = "src/main.rs"

# Auxiliary regenerator for committed man pages under /packaging/man/.
# Run via `cargo run --bin spt-mangen -- --out packaging/man` (or with no args to
# default to the same path). CI uses this to assert no diff vs. the committed
# pages. Keeping it as a separate bin avoids running clap_mangen at every build.
[[bin]]
name = "spt-mangen"
path = "src/bin/spt-mangen.rs"

# Auxiliary regenerator for committed shell completions under
# /packaging/completions/. Run via
# `cargo run --bin spt-completions -- --out packaging/completions`.
[[bin]]
name = "spt-completions"
path = "src/bin/spt-completions.rs"

[dependencies]
# Internal crates
spt-core = { workspace = true }
spt-config = { workspace = true }
spt-config-crypt = { workspace = true }
spt-mem-hygiene = { workspace = true }
spt-secrets = { workspace = true }
spt-state = { workspace = true }
spt-cli = { workspace = true }
spt-net = { workspace = true }
spt-protocol = { workspace = true }
spt-auth = { workspace = true }
spt-key = { workspace = true }
spt-trust = { workspace = true }
spt-forward = { workspace = true }
spt-supervisor = { workspace = true }
spt-ssh2 = { workspace = true }
spt-ssh3 = { workspace = true }
spt-dns = { workspace = true }
spt-firewall = { workspace = true }
spt-service = { workspace = true }
spt-stats = { workspace = true }
spt-events = { workspace = true }
spt-observability = { workspace = true }
spt-mcp = { workspace = true }
spt-tui = { workspace = true }
spt-diagnostics = { workspace = true }
spt-benchmark = { workspace = true }
spt-remote-config = { workspace = true }
spt-status-api = { workspace = true }
spt-snmp = { workspace = true, features = ["testing"], optional = true }
spt-winevent = { workspace = true }

# Async + std
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }

# CLI / serde
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

# Diagnostics
tracing = { workspace = true }
miette = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Misc
atomicwrites = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
secrecy = { workspace = true }
ssh-key = { workspace = true }
tempfile = { workspace = true }

# DNS client for `spt dns query` against the running resolver.
hickory-resolver = { workspace = true }
hickory-proto = { workspace = true }

# Status-API TLS/mTLS wiring (see `crates/spt-bin/src/status_api_tls.rs`).
# These features are already activated workspace-wide by `spt-remote-config`'s
# `testing` feature and other rustls consumers — adding spt-bin as a direct
# consumer is additive and does not bump the lockfile.
axum = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
tower = { workspace = true }
x509-parser = { workspace = true }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "server-auto", "tokio", "service"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-service = { workspace = true }
# Used by `policy::registry` to read GPO values from
# HKLM/HKCU\Software\Policies\spt. Mirrors the feature set used by
# spt-winevent (which also pulls in Win32_System_Registry locally).
windows = { version = "0.58", features = [
    "Win32_System_EventLog",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
# Used by status_api_tls integration tests to mint a self-signed CA, server
# cert, and client cert at test time.
rcgen = { workspace = true }
# `testing` feature exposes MockTunnelProtocol for the lifecycle integration test.
spt-forward = { workspace = true, features = ["testing"] }
# `testing` feature exposes deterministic_keypair / fixtures for cli/key_ops tests.
spt-key = { workspace = true, features = ["testing"] }
# `testing` feature exposes StatusSnapshotBuilder/TempStateDir for cli/*_ops tests.
spt-state = { workspace = true, features = ["testing"] }
# `testing` feature exposes FakeZone/LocalhostResolver for cli/dns_ops tests.
spt-dns = { workspace = true, features = ["testing"] }
# t5-e6 sealed-config tests need to derive X25519 public keys from a raw
# scalar. Pinned to a version already present in Cargo.lock via spt-config-crypt
# so this addition does NOT trigger `cargo update`.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }

[features]
default = []
snmp = ["dep:spt-snmp", "spt-cli/snmp"]
ssh2-vendored-openssl = ["spt-ssh2/vendored-openssl"]

[lints]
workspace = true

