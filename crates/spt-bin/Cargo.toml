[package]
name = "spt-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "spt — permanent SSH2/SSH3 tunnel CLI binary."

[[bin]]
name = "spt"
path = "src/main.rs"

# Auxiliary regenerator for committed man pages under /packaging/man/.
# Run via `cargo run --bin spt-mangen -- --out packaging/man` (or with no args to
# default to the same path). CI uses this to assert no diff vs. the committed
# pages. Keeping it as a separate bin avoids running clap_mangen at every build.
[[bin]]
name = "spt-mangen"
path = "src/bin/spt-mangen.rs"

[dependencies]
# Internal crates
spt-core = { workspace = true }
spt-config = { workspace = true }
spt-secrets = { workspace = true }
spt-state = { workspace = true }
spt-cli = { workspace = true }
spt-net = { workspace = true }
spt-protocol = { workspace = true }
spt-auth = { workspace = true }
spt-key = { workspace = true }
spt-trust = { workspace = true }
spt-forward = { workspace = true }
spt-supervisor = { workspace = true }
spt-ssh2 = { workspace = true }
spt-ssh3 = { workspace = true }
spt-dns = { workspace = true }
spt-firewall = { workspace = true }
spt-service = { workspace = true }
spt-stats = { workspace = true }
spt-events = { workspace = true }
spt-observability = { workspace = true }
spt-mcp = { workspace = true }
spt-tui = { workspace = true }
spt-diagnostics = { workspace = true }
spt-benchmark = { workspace = true }
spt-remote-config = { workspace = true }

# Async + std
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }

# CLI / serde
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

# Diagnostics
tracing = { workspace = true }
miette = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Misc
hex = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
secrecy = { workspace = true }
ssh-key = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-service = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
# `testing` feature exposes MockTunnelProtocol for the lifecycle integration test.
spt-forward = { workspace = true, features = ["testing"] }

[lints]
workspace = true

# ---------------------------------------------------------------------------
# Packaging metadata. CI tooling (cargo-deb, cargo-generate-rpm, cargo-wix)
# reads these tables. The resulting artifacts are produced by CI, not by
# `cargo build`.
# ---------------------------------------------------------------------------

