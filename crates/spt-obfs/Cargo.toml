[package]
name = "spt-obfs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Pluggable obfuscation transports (obfs4, meek-http, ssh-over-websocket, ssh-over-shadowsocks) for spt SSH backends."

[lints]
workspace = true

[features]
default = []
# Exposes the `MockAuditHook` + factories used in cross-crate tests.
testing = []

[dependencies]
spt-core = { workspace = true }
spt-secrets = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
url = { workspace = true }
http = { workspace = true }
# Cryptographic primitives. `aes-gcm` covers the legacy AEAD shadowsocks
# methods; `chacha20poly1305` powers the obfs4 frame layer + the
# ChaCha20-Poly1305 shadowsocks variants. BLAKE3 is the AEAD-2022 KDF.
aes-gcm = { workspace = true }
chacha20poly1305 = "0.10"
hmac = { workspace = true }
sha2 = { workspace = true }
blake3 = "1"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
# Real transports.
reqwest = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
spt-config = { workspace = true }
spt-obfs = { path = ".", version = "0.1", features = ["testing"] }
