[package]
name = "spt-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Runtime state directory, locks, and atomic writes for spt."

[lints]
workspace = true

[features]
testing = ["dep:tempfile"]
# Opt-in gate for Criterion benchmarks. Keeps `cargo test --all-targets` from
# running harness-free benches as part of the normal test gates.
bench = []

[dependencies]
spt-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
directories = { workspace = true }
fs4 = { workspace = true }
atomicwrites = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "snapshot"
path = "benches/snapshot.rs"
harness = false
required-features = ["bench"]
