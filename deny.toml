# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
    # Re-evaluated by t7-CCI 2026-05-21. Workspace MSRV is now 1.85, but
    # Cargo.toml edits are out of scope for this milestone — each entry below
    # was checked against Cargo.lock; affected versions remain locked, so the
    # ignore stays. Lifting will happen alongside the corresponding dep bump
    # in a follow-up milestone.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 still locked; no patched release upstream. Retained for SSH RSA key support and transitive consumers." },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 still locked via ratatui 0.28.x; paste has no patched release." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 still locked; no patched release. Migrating to rustls-pki-types PemObject requires code changes outside dependency policy." },
    { id = "RUSTSEC-2026-0002", reason = "lru 0.12.5 transitive through ratatui 0.28.x; spt does not call lru::IterMut directly. Ratatui releases that move past this dependency require a coordinated dep refresh." },
    { id = "RUSTSEC-2026-0009", reason = "time 0.3.36 locked; fixed in 0.3.47, but that release requires Cargo edition2024 (Rust 1.85+ Cargo). Deferred pending workspace-wide Cargo bump." },
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.24.4 locked; fixed in Hickory 0.26.1 but Hickory 0.26 requires Rust 1.88, exceeds workspace MSRV 1.85." },
    { id = "RUSTSEC-2026-0141", reason = "lettre 0.11.19 locked; spt enables the rustls backend, not the affected Boring TLS backend. MSRV is now 1.85, but lettre 0.11.20+ bump is a Cargo.toml change deferred outside the t7-CCI scope (lockfile freeze)." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Zlib",
    "OpenSSL",
    # Permissive licenses used by transitive crates in the locked graph.
    "0BSD",
    "CDLA-Permissive-2.0",
    # Boost Software License: permissive, OSI-approved, FSF Free/Libre.
    # Pulled in transitively via arboard -> clipboard-win -> error-code (TUI clipboard).
    "BSL-1.0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
