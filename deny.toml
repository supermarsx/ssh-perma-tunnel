# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
    # Re-evaluated by t9-Bump 2026-05-23. Each entry was re-checked against
    # the post-bump Cargo.lock; remaining ignores all have one of:
    #   * No patched stable release (upstream still on RC/pre-release only).
    #   * Patched release requires Rust > 1.85 (workspace MSRV).
    #   * Patched release is in a transitive whose direct consumer is itself
    #     MSRV-blocked (e.g. ratatui 0.30+ → Rust 1.86).
    # RUSTSEC-2026-0141 (lettre) is removed — t9-Bump bump of lettre to 0.11.22.
    { id = "RUSTSEC-2023-0037", reason = "xsalsa20poly1305 0.9.1 unmaintained (renamed to crypto_secretbox); pulled transitively via spt-obfs -> spt-ssh2. The advisory states no safe upgrade is available — the only path is migrating to the crypto_secretbox crate, which is a code change outside dependency policy. Tracked for spt-obfs follow-up." },
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 still locked; only fix is rsa 0.10.x which is RC-only (0.10.0-rc.18). Retained for SSH RSA key support and transitive consumers." },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 still locked via ratatui 0.28.x; paste has no patched release. Ratatui 0.30 requires Rust 1.86 (> workspace MSRV 1.85), so the upstream-side chain that drops paste is itself MSRV-blocked." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 still locked; latest stable release on crates.io and no patched version published. Migrating to rustls-pki-types PemObject requires code changes outside dependency policy." },
    { id = "RUSTSEC-2026-0002", reason = "lru 0.12.5 transitive through ratatui 0.28.x; spt does not call lru::IterMut directly. Ratatui 0.30 (which would update lru) requires Rust 1.86 (> workspace MSRV 1.85)." },
    { id = "RUSTSEC-2026-0009", reason = "time 0.3.36 locked; fixed in 0.3.47, but that release declares rust-version 1.88 (> workspace MSRV 1.85). Re-evaluated by t9-Bump." },
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.24.4 locked; fixed in Hickory 0.26.1 but Hickory 0.26 requires Rust 1.88 (> workspace MSRV 1.85). Hickory 0.25.x compiles on 1.85 but the migration is >50 LOC across spt-dns and was deferred by t9-Bump." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Zlib",
    "OpenSSL",
    # Permissive licenses used by transitive crates in the locked graph.
    "0BSD",
    "CDLA-Permissive-2.0",
    # Boost Software License: permissive, OSI-approved, FSF Free/Libre.
    # Pulled in transitively via arboard -> clipboard-win -> error-code (TUI clipboard).
    "BSL-1.0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
