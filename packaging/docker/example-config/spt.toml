# packaging/docker/example-config/spt.toml
#
# Minimal config tailored for the docker-compose deployment. Validates
# clean with `spt config validate`; copy to `./config/spt.toml` next to
# docker-compose.yml and edit to taste before `docker compose up`.
#
# Container paths assumed:
#   /etc/spt/spt.toml        — this file (bind-mounted, read-only)
#   /var/lib/spt             — state dir (named volume, writable)
#   /run/secrets/*           — vault material (bind-mounted, read-only)
version = 1

[[profiles]]
name = "minimal"
enabled = true
protocol = "ssh2"
host = "bastion.example.com"
port = 22
user = "alice"

[profiles.auth]
# Public-key auth using a key mounted from the host secrets dir. Swap to
# `method = "agent"` if you forward the host's ssh-agent socket instead.
# The key file is read by its absolute path directly (no secret backend); mount
# it read-only at /run/secrets with mode 0600, owned by UID/GID 65532.
method = "publickey"
identity_file = "/run/secrets/id_ed25519"
# A `secret://ns/name` reference (below) is resolved by the file backend. By
# default that root is <state_dir>/secrets (i.e. /var/lib/spt/secrets), NOT
# /run/secrets. To resolve secret:// material from the read-only /run/secrets
# mount, uncomment the [secrets.file] table at the bottom of this file.
# private_key_passphrase = "secret://docker/id-ed25519-passphrase"

[profiles.trust]
mode = "known_hosts"
# Persisted on the named volume so first-run pinning survives restarts.
known_hosts_file = "/var/lib/spt/known_hosts"
strict = true

[[profiles.forwards]]
name = "web"
type = "local"
transport = "tcp"
# Bind 0.0.0.0 inside the container so the compose `ports:` mapping reaches
# it from the host. Restrict host-side exposure via the `ports:` line.
# `expose = true` acknowledges the intentional wildcard bind (the compose
# `ports:` mapping is the real, loopback-scoped exposure gate).
bind = "0.0.0.0:8080"
expose = true
target = "service.internal:80"
target_resolve = "remote"
required = true

# [secrets.file]
# # Resolve `secret://ns/name` references against /run/secrets/ns/name (the
# # read-only secrets bind mount) instead of the default <state_dir>/secrets.
# # Files must be mode 0400/0600 and readable by UID/GID 65532.
# root = "/run/secrets"
