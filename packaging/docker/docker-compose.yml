# packaging/docker/docker-compose.yml — single-service deployment of `spt`.
#
# Production-shaped defaults: non-root, read-only rootfs, dropped caps,
# no-new-privileges, healthcheck wired, named volume for state, bind mount
# for config (read-only), optional bind mount for vault material.
#
# Quickstart:
#   cp .env.example .env
#   mkdir -p config secrets
#   cp example-config/spt.toml config/spt.toml      # or your own
#   docker compose up -d
#
# To run privileged-port forwards (<1024) on the host, add the port mapping
# under `ports:` AND uncomment the NET_BIND_SERVICE capability below.
---
version: "3.9"

services:
  spt:
    image: ${SPT_IMAGE:-ghcr.io/mariana/spt:${SPT_VERSION:-latest}}
    container_name: spt
    restart: unless-stopped
    init: false   # tini already runs as PID 1 inside the image

    # ----- runtime command -------------------------------------------------
    # Defaults from the image already point at /etc/spt/spt.toml + /var/lib/spt.
    # Override `command:` if you need extra flags (e.g. --log-format json).
    # command:
    #   - tunnel
    #   - run
    #   - --foreground
    #   - --config=/etc/spt/spt.toml
    #   - --state-dir=/var/lib/spt
    #   - --log-format=json

    # ----- environment ----------------------------------------------------
    environment:
      SPT_LOG_LEVEL: ${SPT_LOG_LEVEL:-info}
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: "1"

    # ----- volumes --------------------------------------------------------
    volumes:
      # Config: read-only bind mount. Operators edit on the host.
      - type: bind
        source: ./config
        target: /etc/spt
        read_only: true

      # Durable state: known_hosts cache, supervisor lock, snapshots.
      - type: volume
        source: spt-state
        target: /var/lib/spt

      # Optional vault material (private keys, bearer tokens). Omit if the
      # vault uses keychain or env-var backends instead.
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true

    # ----- network --------------------------------------------------------
    # Add a `- "127.0.0.1:HOSTPORT:CONTAINERPORT"` line per forward you want
    # reachable from the host. Defaults route through the .env file.
    ports:
      - "${SPT_FORWARD_PORT_1:-127.0.0.1:8080}:8080"
      # - "${SPT_FORWARD_PORT_2:-127.0.0.1:8443}:8443"

    # ----- healthcheck ----------------------------------------------------
    # The image ships a HEALTHCHECK; we re-declare here so `docker compose ps`
    # always shows it and so the start-period applies during rolling updates.
    healthcheck:
      test:
        - "CMD"
        - "/usr/local/bin/spt"
        - "tunnel"
        - "health"
        - "--output"
        - "json"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    # ----- hardening ------------------------------------------------------
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,uid=1000,gid=1000
      - /run/spt:size=16m,mode=0750,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Only required if spt has to bind a privileged source port on the
    # container side (rare — most forwards bind >=1024).
    # cap_add:
    #   - NET_BIND_SERVICE

    # ----- resource limits ------------------------------------------------
    # Tune these. spt's RSS is dominated by libssh2 channel buffers; a few
    # tens of MiB plus ~5 MiB per active forward is a reasonable starting
    # point.
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.50"
    # Outside Swarm, the deploy.resources block is advisory; uncomment the
    # legacy keys below when running plain `docker compose up`.
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 256

    # ----- logging --------------------------------------------------------
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # ----- ulimits --------------------------------------------------------
    # libssh2 + many forwards => many fds. The default 1024 fits ~200
    # concurrent forwards with headroom for diagnostics.
    ulimits:
      nofile:
        soft: 4096
        hard: 8192

volumes:
  spt-state:
    name: spt-state
