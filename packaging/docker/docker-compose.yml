# packaging/docker/docker-compose.yml — single-service deployment of `spt`.
#
# Production-shaped defaults: non-root, read-only rootfs, dropped caps,
# no-new-privileges, healthcheck wired, named volume for state, bind mount
# for config (read-only), optional bind mount for vault material.
#
# Quickstart:
#   cp .env.example .env
#   mkdir -p config secrets
#   cp example-config/spt.toml config/spt.toml      # or your own
#   docker compose up -d
#
# To run privileged-port forwards (<1024) on the host, add the port mapping
# under `ports:` AND uncomment the NET_BIND_SERVICE capability below.
---
services:
  spt:
    image: ${SPT_IMAGE:-ghcr.io/mariana/spt:${SPT_VERSION:-latest}}
    container_name: spt
    restart: unless-stopped
    init: false   # tini already runs as PID 1 inside the image

    # Run as the image's non-root UID (1000); belt-and-suspenders with the
    # image's own USER directive and matches the tmpfs uid/gid below.
    user: "1000:1000"

    # Give the graceful-shutdown path time to flush. spt's stop budget is
    # ~45s (RECOMMENDED_STOP_TIMEOUT_SECS; the systemd unit uses
    # TimeoutStopSec=45s) so a multi-profile teardown can flush status.json /
    # runtime.json before SIGKILL. Docker's default 10s would cut that short.
    stop_grace_period: 45s

    # ----- runtime command -------------------------------------------------
    # Defaults from the image already point at /etc/spt/spt.toml + /var/lib/spt.
    # Override `command:` if you need extra flags (e.g. --log-format json).
    # command:
    #   - tunnel
    #   - run
    #   - --foreground
    #   - --config=/etc/spt/spt.toml
    #   - --state-dir=/var/lib/spt
    #   - --log-format=json

    # ----- environment ----------------------------------------------------
    environment:
      SPT_LOG_LEVEL: ${SPT_LOG_LEVEL:-info}
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: "1"

    # ----- volumes --------------------------------------------------------
    volumes:
      # Config: read-only bind mount. Operators edit on the host.
      - type: bind
        source: ./config
        target: /etc/spt
        read_only: true

      # Durable state: known_hosts cache, supervisor lock, snapshots.
      - type: volume
        source: spt-state
        target: /var/lib/spt

      # Optional vault material (private keys, bearer tokens). Omit if the
      # vault uses keychain or env-var backends instead.
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true

    # ----- network --------------------------------------------------------
    # Add a `- "127.0.0.1:HOSTPORT:CONTAINERPORT"` line per forward you want
    # reachable from the host. Defaults route through the .env file.
    ports:
      - "${SPT_FORWARD_PORT_1:-127.0.0.1:8080}:8080"
      # - "${SPT_FORWARD_PORT_2:-127.0.0.1:8443}:8443"

    # ----- healthcheck ----------------------------------------------------
    # The image ships a HEALTHCHECK; we re-declare here so `docker compose ps`
    # always shows it and so the start-period applies during rolling updates.
    healthcheck:
      test:
        - "CMD"
        - "/usr/local/bin/spt"
        - "tunnel"
        - "health"
        - "--output"
        - "json"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    # ----- hardening ------------------------------------------------------
    read_only: true
    tmpfs:
      # Bounded (size=) so a fill can't exhaust host RAM, plus
      # noexec/nosuid/nodev so nothing dropped here can be executed or used to
      # escalate. These are the ONLY writable non-volume paths.
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777,uid=1000,gid=1000
      - /run/spt:rw,noexec,nosuid,nodev,size=16m,mode=0750,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
      # Default Docker seccomp profile stays APPLIED (never `seccomp:unconfined`).
    cap_drop:
      - ALL
    # Only required if spt has to bind a privileged source port on the
    # container side (rare — most forwards bind >=1024).
    # cap_add:
    #   - NET_BIND_SERVICE

    # Containment invariants (deliberately ABSENT): no `privileged: true`, no
    # `network_mode: host`, no `pid: host` / `ipc: host`, no Docker-socket
    # mount. A compromise stays confined to this container.

    # ----- resource limits ------------------------------------------------
    # Tune these. spt's RSS is dominated by the russh/libssh2 channel buffers;
    # a few tens of MiB plus ~5 MiB per active forward is a reasonable starting
    # point. Keep the deploy.resources.limits values in sync with the legacy
    # keys below — Compose v5 rejects distinct values for the same limit.
    #
    # Memory-leak / OOM safety: mem_limit is the hard ceiling; memswap_limit ==
    # mem_limit disables swap so a runaway leak is OOM-killed at 256m (not
    # allowed to thrash host swap), and `restart: unless-stopped` above brings
    # the container back. Raise mem_limit + memswap_limit + limits.memory
    # together. PIDs 256 caps a fork-bomb; each forward is an async task, not a
    # PID, so 256 covers hundreds of forwards. See docs/docker.md.
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.50"
          pids: 256
        reservations:
          memory: 64m
    # Outside Swarm the deploy block is advisory; the legacy keys below are what
    # plain `docker compose up` actually enforces. Keep them IN SYNC.
    mem_limit: 256m
    memswap_limit: 256m      # == mem_limit → no swap escape; OOM-kill is real
    mem_reservation: 64m     # soft floor, matches reservations.memory
    cpus: 0.5
    pids_limit: 256

    # ----- logging --------------------------------------------------------
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # ----- ulimits --------------------------------------------------------
    # libssh2 + many forwards => many fds. The default 1024 fits ~200
    # concurrent forwards with headroom for diagnostics.
    ulimits:
      nofile:
        soft: 4096
        hard: 8192

volumes:
  spt-state:
    name: spt-state
