ShortDescription: Permanent SSH/SSH3 tunnels with reconnect and service integration
Description: |-
  spt establishes and maintains permanent SSH tunnels — local and reverse
  port forwards that survive network drops, host restarts, service
  restarts, DNS changes, and normal operational drift. It supports both
  classical SSH (libssh2 / russh backends) and SSH3 over QUIC, ships as a
  Windows service via the SCM, and exposes structured diagnostics, event
  logging, and SNMP for operability.
