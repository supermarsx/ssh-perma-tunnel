# Audit workflow.
#
# Runs cargo-audit (RustSec advisory DB) and cargo-deny on a weekly schedule,
# on Cargo.lock changes landing on main, and on manual dispatch. The CI
# pipeline already runs cargo-deny per-PR; this workflow ensures we still
# notice newly disclosed advisories against an unchanged dependency graph.
name: Audit

on:
  schedule:
    # Mondays 03:17 UTC — off-peak, off-hour to avoid colliding with a
    # crate.io publish wave.
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/audit.yml'

jobs:
  cargo-audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    env:
      CARGO_AUDIT_VERSION: "0.22.1"
      # Keep this list in sync with deny.toml [advisories].ignore. These
      # advisories are reviewed exceptions, not blanket suppressions.
      CARGO_AUDIT_IGNORES: >-
        --ignore RUSTSEC-2023-0071
        --ignore RUSTSEC-2024-0436
        --ignore RUSTSEC-2025-0134
        --ignore RUSTSEC-2026-0002
        --ignore RUSTSEC-2026-0009
        --ignore RUSTSEC-2026-0119
        --ignore RUSTSEC-2026-0141
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - name: Audit Cargo.lock
        run: cargo audit --deny warnings $CARGO_AUDIT_IGNORES

  cargo-deny:
    name: cargo-deny (scheduled re-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
