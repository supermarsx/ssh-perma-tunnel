name: Perf Regression

# Runs the perf matrix on PRs touching perf-relevant code, and publishes
# the rendered dashboard to gh-pages on push to main. The PR-time job
# runs only the `spt` comparator (skipping openssh/autossh) to keep
# turnaround tight; the release-time matrix runs in the dedicated
# release workflow.
#
# Locks for this file: t8-C4. The C5 workstream owns `ci.yml`; this
# workflow is intentionally separate so its install steps and runners
# can evolve independently.

on:
  pull_request:
    paths:
      - 'crates/spt-benchmark/**'
      - 'crates/spt-supervisor/**'
      - 'crates/spt-forward/**'
      - 'crates/spt-ssh2/**'
      - 'scripts/perf/**'
      - 'docs/perf/baseline-v1.0.json'
      - '.github/workflows/bench-regression.yml'
  push:
    branches: [main]
    paths:
      - 'crates/spt-benchmark/**'
      - 'crates/spt-supervisor/**'
      - 'crates/spt-forward/**'
      - 'crates/spt-ssh2/**'
      - 'scripts/perf/**'
      - 'docs/perf/baseline-v1.0.json'
      - '.github/workflows/bench-regression.yml'
  workflow_dispatch:

# Cancel any in-progress bench on the same PR ref when a new push arrives.
# `main` is never cancelled (publish-to-gh-pages must complete on whichever
# commit triggered it).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  bench:
    name: bench (PR-reduced matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Install comparators
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client autossh python3

      - name: Run matrix (reduced — spt only)
        env:
          # run_matrix.sh reads the output directory from OUT_DIR and
          # writes one JSON per cell plus an aggregate matrix.json.
          OUT_DIR: docs/perf/runs/pr
        run: |
          bash scripts/perf/run_matrix.sh \
            --tools spt \
            --upstream 127.0.0.1:22

      - name: Check regression vs baseline
        run: |
          python3 scripts/perf/regression_check.py \
            --baseline docs/perf/baseline-v1.0.json \
            --current  docs/perf/runs/pr/matrix.json \
            --threshold 10

      - name: Render HTML dashboard
        if: always()
        run: |
          python3 scripts/perf/render_html.py \
            --input    docs/perf/runs/pr/matrix.json \
            --baseline docs/perf/baseline-v1.0.json \
            --output   docs/perf/dashboard.html

      - name: Upload dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-dashboard
          path: docs/perf/dashboard.html
          if-no-files-found: warn

  publish:
    name: publish dashboard to gh-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: bench
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: perf-dashboard
          path: ./dashboard-out

      - name: Stage publish directory
        run: |
          mkdir -p publish
          cp dashboard-out/dashboard.html publish/dashboard.html
          # Keep the latest baseline alongside the dashboard so consumers
          # can fetch both from gh-pages without cloning the repo.
          cp docs/perf/baseline-v1.0.json publish/baseline-v1.0.json

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          destination_dir: perf
          keep_files: false
