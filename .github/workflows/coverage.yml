# Coverage workflow.
#
# Generates LCOV line-coverage data for the workspace via cargo-llvm-cov and
# uploads to Codecov. Runs on every PR to main and on pushes to main.
#
# This job uses the stable toolchain (not MSRV 1.83) because cargo-llvm-cov
# itself benefits from llvm-tools-preview from a recent rustc; the workspace
# under test still respects rust-toolchain.toml so the compiled code is
# built with the pinned channel.
name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: llvm-cov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain with llvm-tools-preview
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      # Pinned to a version known to build under stable rustc on the runner
      # while exercising a workspace that targets MSRV 1.83. cargo-llvm-cov
      # 0.6.x is stable and widely used; bump deliberately.
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.6.11

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
