# =============================================================================
# Consolidated CI for ssh-perma-tunnel (spt)
# =============================================================================
#
# Pipeline (standard):
#
#   fmt ────┐
#           ├──> test (matrix × 6) ──> build (matrix × 6) ──> release (main)
#   clippy ─┘                                                  └─ docker push
#
# -----------------------------------------------------------------------------
# Platform matrix (the 6)
# -----------------------------------------------------------------------------
#
#   target                          runner              native?
#   ------------------------------  ------------------  --------------------
#   x86_64-unknown-linux-gnu        ubuntu-latest       yes
#   aarch64-unknown-linux-gnu       ubuntu-24.04-arm    yes (free-tier ARM
#                                                       runner, GA 2025-04;
#                                                       fall back to
#                                                       ubuntu-latest + cross
#                                                       + QEMU if unavailable)
#   x86_64-apple-darwin             macos-13            yes (Intel)
#   aarch64-apple-darwin            macos-14            yes (Apple Silicon)
#   x86_64-pc-windows-msvc          windows-2025-vs2026      yes
#   aarch64-pc-windows-msvc         windows-11-arm      yes (preview, 2025;
#                                                       fall back to
#                                                       windows-2025-vs2026 with
#                                                       --target only; tests
#                                                       skip on the fallback)
#
# Operator override: set repository variable / env `SPT_FORCE_CROSS=1` (read
# by the matrix `cross` flag) to force cross+QEMU execution on every target,
# regardless of runner image availability. This is the manual escape hatch
# when a native runner image is broken or quota-exhausted.
#
# MSRV (1.88) is the single toolchain we use — it is implicitly tested by
# every fmt / clippy / test / build job. There is no separate `msrv` job.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MSRV: 1.88

# Cancel any in-progress run on the same ref when a new push arrives, EXCEPT
# on `main` and tag refs — a release run (downstream of build) must always run
# to completion. Cancelling a release mid-flight can leave a pushed tag with no
# GitHub release and no bump commit (E9-F8), orphaning the tag and breaking
# bump-version.sh's tag-derived counter + the changelog prev_tag computation.
# PR / feature-branch runs are still superseded by the latest push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # fmt — fast style gate (~30s).
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  # clippy — full workspace lint, pinned at MSRV (the contract).
  # ---------------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-msrv
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libkrb5-dev clang libclang-dev
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ---------------------------------------------------------------------------
  # all-features — compile + lint + test EVERY feature-gated surface (otlp, snmp,
  # yubikey, ssh3 server-selfsigned, config-crypt, mount backends, hickory bench,
  # …). The `clippy`/`typecheck`/`test` jobs build DEFAULT features only, so
  # feature-gated code can silently ROT against dependency API changes with no
  # CI signal — as spt-benchmark's hickory-resolver driver did (fixed 26.45).
  # This job is the guard for that class. Runs on Linux so cfg(unix) + FUSE
  # paths compile too.
  # ---------------------------------------------------------------------------
  all-features:
    name: all-features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: all-features
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libkrb5-dev clang libclang-dev libfuse-dev
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked -- --test-threads=1

  # ---------------------------------------------------------------------------
  # typecheck — fast `cargo check` gate. Runs in parallel with fmt + clippy and
  # gives quicker type-error feedback than the full test matrix.
  # ---------------------------------------------------------------------------
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: typecheck
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libkrb5-dev clang libclang-dev
      - run: cargo check --workspace --locked

  # ---------------------------------------------------------------------------
  # chaos — reconnect / chaos-proxy scenario suite (E8-F12).
  #
  # The chaos harness lives in a DECOUPLED workspace (tests/chaos/Cargo.toml is
  # `[workspace]`-isolated, NOT a root member) so it never runs under the
  # default `cargo test --workspace` matrix above. This job exercises it on
  # Linux only — the harness spawns stub SSH/DNS servers + the chaos proxy on
  # loopback, which is cheapest and most deterministic on the GitHub Linux
  # runner.
  #
  # Only the two PR-gating scenarios (max_attempts_exhaustion,
  # rst_storm_100_per_sec) run here — the other 10 are `#[ignore]` and timing-
  # sensitive (run under SPT_CHAOS_FULL=1 in a nightly job, not on PRs).
  #
  # Non-gating: `continue-on-error: true` keeps the owner's PR-speed intent —
  # a flaky chaos run never blocks a merge; it surfaces as an amber check.
  # ---------------------------------------------------------------------------
  chaos:
    name: chaos
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: chaos
          workspaces: ". -> target\n tests/chaos -> tests/chaos/target"
      - name: Install Linux system deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libkrb5-dev clang libclang-dev
      - name: Run chaos scenarios (PR-gating subset)
        shell: bash
        # Decoupled manifest; runs only the non-#[ignore]'d scenarios.
        # --test-threads=1: scenarios bind loopback ports + drive the
        # supervisor's process-global test hooks, which race in parallel.
        run: cargo test --manifest-path tests/chaos/Cargo.toml --locked -- --test-threads=1

  # ---------------------------------------------------------------------------
  # property — property-based invariant suite (tests/property).
  #
  # Like chaos, tests/property is a DECOUPLED sub-workspace (its Cargo.toml is
  # `[workspace]`-isolated with its own Cargo.lock) so it never runs under the
  # default `cargo test --workspace` matrix. Without this job the invariant
  # suite (config TOML round-trip, redaction idempotency, ssh3 frame / BER
  # round-trips, duration/address/event-template invariants) ran in NO CI job at
  # all. These are correctness invariants, so unlike chaos this job GATES
  # (no `continue-on-error`); the tests are fast (<2s total) and deterministic
  # (arbitrary-driven with fixed seeds, no timing/network).
  #
  # NB: after any change to a main-workspace crate that tests/property depends
  # on (spt-core/config/protocol/ssh3/snmp/events), regenerate
  # tests/property/Cargo.lock (`cd tests/property && cargo build`) or this job
  # fails the `--locked` check — same maintenance contract as tests/chaos.
  #
  # NOT gated here (deliberate exclusion): tests/perf-recovery and
  # tests/perf-startup are perf BENCHES — their test fns are `#[ignore]`'d by
  # default and assert p95 timing ceilings (e.g. PEER_KILL_RECOVERY_P95_MS).
  # Wall-clock thresholds are flaky under shared GitHub-runner contention, so
  # they are intentionally not PR gates; run them manually / in a perf job with
  # `cargo test --manifest-path tests/perf-recovery/Cargo.toml -- --ignored`.
  # ---------------------------------------------------------------------------
  property:
    name: property
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: property
          workspaces: ". -> target\n tests/property -> tests/property/target"
      - name: Install Linux system deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libkrb5-dev clang libclang-dev
      - name: Run property-based invariant suite
        shell: bash
        run: cargo test --manifest-path tests/property/Cargo.toml --locked

  # ---------------------------------------------------------------------------
  # prepare-release — compute the next YY.N once, share the bumped Cargo.toml
  # + Cargo.lock with every downstream job via the `prepared-source` artifact.
  #
  # Why this exists: `cargo build` / `cargo-deb` / `cargo-generate-rpm` /
  # `cargo-wix` all read the workspace version from Cargo.toml at the moment
  # they run, and bake it into their output filenames (`spt_0.26.3_amd64.deb`,
  # `spt-26.3.msi`, …). Historically the release job did the bump AFTER the
  # package matrix had already finished, so a release tagged 26.4 carried
  # artifacts named 26.3. The dist-dir rename step closed the directory-name
  # gap but not the filename gap.
  #
  # Solution: bump once, up front, and have every job consume the same
  # bumped source. Idempotent — bump-version.sh computes a deterministic next
  # version from the existing tag set, regardless of how many times it runs.
  # ---------------------------------------------------------------------------
  prepare-release:
    name: prepare-release
    runs-on: ubuntu-latest
    outputs:
      version:       ${{ steps.bump.outputs.version }}
      tag:           ${{ steps.bump.outputs.tag }}
      cargo_version: ${{ steps.bump.outputs.cargo_version }}
      prev_tag:      ${{ steps.bump.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # bump-version.sh inspects `git tag --list "${YY}.*"` to compute N;
          # shallow checkout has no tag refs.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Compute next YY.N and bump Cargo.toml + Cargo.lock
        id: bump
        shell: bash
        run: bash scripts/release/bump-version.sh
      - name: Upload prepared-source (Cargo.toml + Cargo.lock)
        uses: actions/upload-artifact@v7
        with:
          name: prepared-source
          path: |
            Cargo.toml
            Cargo.lock
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # test — full matrix, all 6 OS×arch combos. Runs after fmt + clippy + typecheck.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.target }})
    needs: [fmt, clippy, typecheck, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
            can_test: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            cross: false
            can_test: true
          # x86_64-apple-darwin (macos-13 / Intel) dropped: GitHub's Intel-Mac
          # runner is being retired and was hanging the run indefinitely
          # (queued with no runner assigned). macos-latest is ARM, so there is
          # no native substitute. Re-add via cross-compile on macos-14 if Intel
          # coverage is needed.
          - target: aarch64-apple-darwin
            runner: macos-14
            cross: false
            can_test: true
          - target: x86_64-pc-windows-msvc
            runner: windows-2025-vs2026
            cross: false
            can_test: true
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            cross: false
            can_test: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Overlay prepared-source (bumped Cargo.toml + Cargo.lock)
        uses: actions/download-artifact@v8
        with:
          name: prepared-source
          # Extract at repo root, overwriting the as-checked-out Cargo.toml +
          # Cargo.lock with the prepare-release bumped copies so every cargo
          # invocation in this job sees the to-be-released version.
          path: .
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Share a single cache namespace with the `build` job for the
          # same target — cargo stores debug + release artifacts in
          # separate `target/<triple>/{debug,release}/` subdirs, so the
          # two jobs don't trample each other's outputs but DO share the
          # populated dep registry + the slow third-party crates. The
          # `build` job (release compile) used to pay a full cold compile
          # because it keyed on `build-<target>` and missed the cache
          # `test-<target>` had already populated. `shared-key` is the
          # documented Swatinem mechanism for this scenario.
          shared-key: workspace-${{ matrix.target }}
          # cache-on-failure helps with iterative debugging — even a red
          # run leaves enough warm artifacts that the next push restores
          # quickly.
          cache-on-failure: true
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libkrb5-dev clang libclang-dev
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The workspace links many large debug test/release binaries; the
          # runner's ~14 GB root fs ran out of space during linking ("No space
          # left on device"). Reclaim ~20 GB of preinstalled SDKs we don't use.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - name: Install cross (QEMU path)
        if: ${{ matrix.cross || env.SPT_FORCE_CROSS == '1' }}
        shell: bash
        run: cargo install cross --locked --version 0.2.5
      # `--test-threads=1`: many tests mutate process-global env vars
      # (SPT_*, EDITOR overrides, etc.) across ~20 modules; running them in
      # parallel races (a sibling test clobbers another's env mid-assertion).
      # Serializing is the pragmatic fix vs. a mutex in every such test.
      #
      # aarch64-unknown-linux-gnu memory cap: the free ARM runner ships with
      # 7 GB RAM. The workspace's ~50 crates with full debuginfo on a fresh
      # cache miss have repeatedly OOM-killed the runner during linking
      # (exit code 143 mid-compile, no test ever ran). Cap `cargo build`
      # parallelism to 2 rustc workers on aarch64-linux only — peak memory
      # drops by ~half, wall time goes up ~25%. Other runners (x86_64-linux
      # 16 GB, macos-14 14 GB, windows 16 GB) keep the default `nproc`
      # parallelism since they don't hit the ceiling.
      - name: cargo test (native)
        if: ${{ matrix.can_test && !matrix.cross && env.SPT_FORCE_CROSS != '1' }}
        shell: bash
        env:
          # `default` (literal string) is cargo's accepted spelling for
          # "use num_cpus". An empty string is rejected with
          # "could not parse ``", so the conditional cannot collapse to ''.
          CARGO_BUILD_JOBS: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '2' || 'default' }}
        run: cargo test --workspace --locked --no-fail-fast --target ${{ matrix.target }} -- --test-threads=1
      - name: cargo test (cross / QEMU)
        if: ${{ matrix.can_test && (matrix.cross || env.SPT_FORCE_CROSS == '1') }}
        shell: bash
        run: cross test --workspace --locked --no-fail-fast --target ${{ matrix.target }} -- --test-threads=1
      - name: cargo check (no-run target)
        if: ${{ !matrix.can_test }}
        shell: bash
        run: cargo check --workspace --locked --target ${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # build — release compile per target. Uploads the raw binary for `package`.
  # Packaging lives in a separate job so a packaging failure is isolated from
  # the compile and reruns cheaply.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.target }})
    needs: [test, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, cross: false, os: linux }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, cross: false, os: linux }
          # x86_64-apple-darwin (macos-13 / Intel) dropped — retired runner.
          - { target: aarch64-apple-darwin, runner: macos-14, cross: false, os: macos }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025-vs2026, cross: false, os: windows }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, cross: false, os: windows }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Overlay prepared-source (bumped Cargo.toml + Cargo.lock)
        uses: actions/download-artifact@v8
        with:
          name: prepared-source
          path: .
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Pair with the `test` job's shared-key so the release compile
          # here resumes from the warm cache that job populated a few
          # minutes earlier instead of starting cold.
          shared-key: workspace-${{ matrix.target }}
          cache-on-failure: true
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libkrb5-dev clang libclang-dev
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - name: Install cross (QEMU path)
        if: ${{ matrix.cross || env.SPT_FORCE_CROSS == '1' }}
        shell: bash
        run: cargo install cross --locked --version 0.2.5
      - name: Build release
        shell: bash
        env:
          # Same OOM mitigation as the `test` step — aarch64-linux free
          # runner OOMs during release linking otherwise. `default` is
          # cargo's spelling for "use num_cpus"; an empty string is a
          # parse error.
          CARGO_BUILD_JOBS: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '2' || 'default' }}
        run: |
          if [[ "${{ matrix.cross }}" == "true" || "${SPT_FORCE_CROSS:-0}" == "1" ]]; then
            cross build --workspace --locked --release --target ${{ matrix.target }}
          else
            cargo build --workspace --locked --release --target ${{ matrix.target }}
          fi
      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/spt
            target/${{ matrix.target }}/release/spt.exe
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # package — turn each built binary into distributable artifacts (tarball,
  # deb/rpm, pkg, zip/msi). Downstream of `build`; consumes the uploaded binary
  # so it never recompiles. Packaging tools that don't build on MSRV 1.88
  # (cargo-deb) are installed as prebuilt binaries.
  # ---------------------------------------------------------------------------
  package:
    name: package (${{ matrix.target }})
    needs: [build, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, os: linux }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, os: linux }
          - { target: aarch64-apple-darwin, runner: macos-14, os: macos }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025-vs2026, os: windows }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, os: windows }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Overlay prepared-source (bumped Cargo.toml + Cargo.lock)
        uses: actions/download-artifact@v8
        with:
          name: prepared-source
          path: .
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - name: Download release binary
        uses: actions/download-artifact@v8
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release
      - name: Make binary executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x "target/${{ matrix.target }}/release/spt"
      - name: Install cargo-deb / cargo-generate-rpm (Linux GNU, prebuilt)
        if: ${{ matrix.os == 'linux' && endsWith(matrix.target, '-linux-gnu') }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Install cargo-wix (prebuilt)
        if: ${{ matrix.os == 'windows' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix
      # The windows-2025-vs2026 image ships WiX 3 preinstalled, but the
      # windows-11-arm image does not. Historically we ran
      # `choco install wixtoolset` on the ARM runner — that took ~19
      # minutes per release because Chocolatey on ARM has to fetch +
      # install + reboot-prep the full MSI installer. Replace it with a
      # direct download of the WiX 3.14.1 binaries zip from upstream
      # GitHub (the zip is ~30 MB) and cache the archive. Every run
      # verifies the pinned SHA-256 before extracting the tools.
      - name: Cache WiX 3 binaries (windows-11-arm)
        id: wix-cache
        if: ${{ matrix.os == 'windows' && matrix.target == 'aarch64-pc-windows-msvc' }}
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\wix314-binaries.zip
          # Bump the version suffix when WIX_VERSION/WIX_SHA256 below changes.
          key: wix-3.14.1-${{ runner.os }}-${{ runner.arch }}-v2
      - name: Download WiX 3 binaries (windows-11-arm, cache miss)
        if: >-
          ${{ matrix.os == 'windows'
              && matrix.target == 'aarch64-pc-windows-msvc'
              && steps.wix-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          $zip = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Write-Host "Downloaded WiX 3 archive to $zip"
      - name: Add WiX 3 to PATH (windows-11-arm)
        if: ${{ matrix.os == 'windows' && matrix.target == 'aarch64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          # Verify the cached/downloaded archive before trusting any WiX
          # executable from it; this protects both first-fill downloads and
          # restored cache contents.
          $zip = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
          $expectedSha256 = "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31"
          if (-not (Test-Path $zip)) {
            Write-Error "WiX archive not found at $zip"
            exit 1
          }
          $actualSha256 = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            Write-Error "WiX archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
            exit 1
          }

          # The zip carries candle.exe / light.exe / heat.exe — everything
          # cargo-wix shells out to. Extract only after the digest matches.
          $dst = Join-Path $env:RUNNER_TEMP "wix314"
          Remove-Item $dst -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $dst | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # Sanity-check that candle.exe is present in the verified archive.
          if (-not (Test-Path (Join-Path $dst "candle.exe"))) {
            Write-Error "candle.exe not found under $dst after WiX install"
            exit 1
          }
          Write-Host "WiX 3 on PATH: $(Join-Path $dst 'candle.exe')"
      - name: Pack tarball (Linux/macOS)
        if: ${{ matrix.os != 'windows' }}
        shell: bash
        run: bash scripts/package/pack-tarball.sh ${{ matrix.target }}
      - name: Pack deb (Linux GNU)
        if: ${{ matrix.os == 'linux' && endsWith(matrix.target, '-linux-gnu') }}
        shell: bash
        run: bash scripts/package/pack-deb.sh ${{ matrix.target }}
      - name: Pack rpm (Linux GNU)
        if: ${{ matrix.os == 'linux' && endsWith(matrix.target, '-linux-gnu') }}
        shell: bash
        run: bash scripts/package/pack-rpm.sh ${{ matrix.target }}
      - name: Stage universal macOS binary
        if: ${{ matrix.os == 'macos' }}
        shell: bash
        run: |
          # Only arm64 is built (Intel runner dropped). A single-arch Mach-O is
          # a valid "universal"; pack-pkg-macos.sh expects this path.
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/spt \
            "target/${{ matrix.target }}/release/spt"
      - name: Pack pkg (macOS)
        if: ${{ matrix.os == 'macos' }}
        shell: bash
        # pack-pkg-macos.sh takes no target arg — it always uses the staged
        # universal binary (target/universal-apple-darwin/release/spt).
        run: bash scripts/package/pack-pkg-macos.sh
      - name: Pack zip (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: ./scripts/package/pack-zip.ps1 ${{ matrix.target }}
      - name: Pack MSI (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: ./scripts/package/pack-msi-windows.ps1 ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: spt-${{ matrix.target }}
          path: dist/**
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # release — rolling YY.N release. Only fires on push-to-main.
  # Folded docker push from the deleted docker.yml.
  # ---------------------------------------------------------------------------
  release:
    name: release
    needs: [package, prepare-release]
    if: >-
      ${{ github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && !contains(github.event.head_commit.message, '[skip release]')
          && !contains(github.event.head_commit.message, 'release: skip') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # Re-export prepare-release outputs under the legacy `steps.bump.outputs`
    # names this job's downstream steps used to read. Saves a sweep through
    # every `${{ steps.bump.outputs.X }}` reference below.
    env:
      RELEASE_VERSION:       ${{ needs.prepare-release.outputs.version }}
      RELEASE_TAG:           ${{ needs.prepare-release.outputs.tag }}
      RELEASE_CARGO_VERSION: ${{ needs.prepare-release.outputs.cargo_version }}
      RELEASE_PREV_TAG:      ${{ needs.prepare-release.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Overlay prepared-source (bumped Cargo.toml + Cargo.lock)
        uses: actions/download-artifact@v8
        with:
          name: prepared-source
          # NB: target a non-conflicting subdirectory below the workspace and
          # then copy in — `path: .` would extract alongside the rest of the
          # artifacts download below. Order matters: overlay must happen
          # before any cargo invocation, BUT after checkout, BUT before the
          # all-artifacts download (which lands at artifacts/, never touching
          # the workspace root). Doing it here is safe.
          path: .
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Stage dist/
        shell: bash
        run: |
          mkdir -p dist
          # Each upload-artifact was rooted at dist/**, so each downloaded
          # subdir already contains the per-target dist tree. Merge them.
          for d in artifacts/spt-*; do
            if [[ -d "$d" ]]; then cp -r "$d"/. dist/; fi
          done
      - name: Re-emit bump outputs (consumed by legacy step references)
        id: bump
        shell: bash
        run: |
          # prepare-release already bumped Cargo.toml + Cargo.lock and emitted
          # the version values as job outputs. Re-publish those values under
          # the `steps.bump.outputs.*` names every downstream step in this
          # job uses, so we don't have to sweep the rest of the YAML.
          {
            echo "version=${RELEASE_VERSION}"
            echo "tag=${RELEASE_TAG}"
            echo "cargo_version=${RELEASE_CARGO_VERSION}"
            echo "prev_tag=${RELEASE_PREV_TAG}"
          } >> "${GITHUB_OUTPUT}"
          echo "::notice::release ${RELEASE_TAG} (cargo ${RELEASE_CARGO_VERSION}); prev: ${RELEASE_PREV_TAG:-<none>}"
      - name: Align dist/<version>/ with the bumped Cargo version
        shell: bash
        env:
          NEW_CARGO_VERSION: ${{ steps.bump.outputs.cargo_version }}
        run: |
          # Now mostly defensive: the package matrix overlays the prepared
          # source up front, so dist/<NEW_CARGO_VERSION>/ should already
          # exist. Kept for backwards-compatibility with operator-triggered
          # workflow_dispatch runs that bypass prepare-release.
          set -e
          target="dist/${NEW_CARGO_VERSION}"
          if [[ -d "$target" ]]; then
            echo "::notice::$target already exists; nothing to align"
            exit 0
          fi
          shopt -s nullglob
          mapfile -t existing < <(find dist -maxdepth 1 -mindepth 1 -type d \
              -regextype posix-extended -regex 'dist/0\.[0-9]+\.[0-9]+' | sort)
          if (( ${#existing[@]} == 0 )); then
            echo "::error::no dist/<version>/ subdirectory found to align with ${NEW_CARGO_VERSION}"
            ls -la dist/
            exit 1
          fi
          if (( ${#existing[@]} > 1 )); then
            echo "::error::multiple version dirs under dist/, refusing to guess: ${existing[*]}"
            exit 1
          fi
          src="${existing[0]}"
          echo "::notice::renaming ${src} → ${target}"
          mv "$src" "$target"
      - name: Abort if tag already exists
        shell: bash
        run: |
          tag="${{ steps.bump.outputs.tag }}"
          if git ls-remote --tags --exit-code origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::${tag} already exists on origin; refusing to clobber"
            exit 1
          fi
      - name: Generate CHANGELOG fragment
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          prev_tag=$(git tag --list '[0-9]*' --sort=-version:refname | grep -v "^${TAG}$" | head -n1 || true)
          mkdir -p "dist/${TAG}"
          frag="dist/${TAG}/CHANGELOG-fragment.md"
          curated="docs/releases/${VERSION}.md"
          # Prefer a curated docs/releases/<VERSION>.md (dropped by the
          # close-out commit) over an auto-generated git-log fragment.
          # Falls back to a synthesised fragment when no curated file
          # exists. This matches docs/releases/readme.md's authoring
          # contract.
          if [[ -f "${curated}" ]]; then
            echo "::notice::using curated release notes from ${curated}"
            cp "${curated}" "${frag}"
          else
            echo "::warning::no curated docs/releases/${VERSION}.md; synthesising from git log"
            {
              echo "# spt ${VERSION}"
              echo
              if [[ -n "${prev_tag}" ]]; then
                echo "## Changes since ${prev_tag}"
                echo
                git log --pretty=format:"- %s (%h)" "${prev_tag}..HEAD"
              else
                echo "## Initial rolling release"
                echo
                git log --pretty=format:"- %s (%h)" -n 50
              fi
              echo
            } >"${frag}"
          fi
          if [[ -f changelog.md ]]; then
            today=$(date -u +%Y-%m-%d)
            { echo "## [${VERSION}] - ${today}"; echo; cat "${frag}"; echo; cat changelog.md; } >changelog.md.new
            mv changelog.md.new changelog.md
          fi
      - name: Generate checksums
        shell: bash
        env:
          LINUX_GPG_KEY: ${{ secrets.LINUX_GPG_KEY }}
        run: bash scripts/sign/checksum-all.sh
      - name: Minisign artifacts (gated)
        if: ${{ env.MINISIGN_SECRET_KEY != '' }}
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: bash scripts/sign/minisign-all.sh
      - name: Generate SBOM
        shell: bash
        run: bash scripts/sbom/gen-sbom.sh
      - name: Build release manifest
        shell: bash
        run: bash scripts/release/manifest.sh
      - name: Push version-bump commit and tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.email "ci@spt.local"
          git config user.name  "spt-ci"
          # Cargo.lock is refreshed by bump-version.sh (`cargo update -w`)
          # so its workspace-member version entries match Cargo.toml. Include
          # it in the bump commit — without it, the next push's `cargo
          # --locked` gates fail with "the lock file needs to be updated".
          git add Cargo.toml Cargo.lock changelog.md 2>/dev/null || true
          # [skip ci] is REQUIRED: this bump commit is pushed back to main, and
          # without it the new push would re-run CI and cut another release —
          # an infinite release loop.
          git commit -m "release: ${TAG} [skip ci]" || true
          git tag -a "${TAG}" -m "spt ${TAG}"
          # --atomic: push the branch ref and the tag ref in a single
          # transaction. If main advanced during the ~10 min release job and
          # the branch push is rejected (non-FF), the tag is NOT pushed either,
          # avoiding an orphaned tag with no bump commit (E9-F8).
          git push --atomic origin HEAD:main "refs/tags/${TAG}"
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          # Gather every distributable from dist/ regardless of the version
          # string in its path: packages embed the Cargo version (0.YY.N) while
          # the release/changelog dir uses the bare tag (YY.N). Also pick up the
          # generated checksums / SBOM / manifest / signatures.
          mapfile -t assets < <(find dist -type f \( \
              -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg' \
              -o -name '*.msi' -o -name '*.zip' -o -name '*.sha256' \
              -o -name '*.sha256sums' -o -name '*sbom*' -o -name '*.spdx.*' \
              -o -name '*.minisig' -o -name '*manifest*.json' \) | sort -u)
          echo "release assets:"; printf '  %s\n' "${assets[@]}"
          gh release create "${TAG}" \
            --target main \
            --title  "spt ${TAG}" \
            --notes-file "dist/${TAG}/CHANGELOG-fragment.md" \
            "${assets[@]}"
      - name: Stage Linux binaries for Docker build context
        shell: bash
        run: |
          # scripts/docker/Dockerfile COPYs `dist/spt-${TARGETARCH}` where
          # TARGETARCH is buildx's per-platform variable (amd64|arm64). The
          # `binary-*` artifacts uploaded by the `build` matrix were uploaded
          # with a single path matching one file, so upload-artifact v4+
          # places the file at the artifact root rather than preserving the
          # `target/<triple>/release/` prefix. Use `find` to locate the
          # binary regardless of how the artifact happens to be laid out.
          set -e
          for triple_arch in "x86_64-unknown-linux-gnu:amd64" "aarch64-unknown-linux-gnu:arm64"; do
            triple="${triple_arch%:*}"
            arch="${triple_arch#*:}"
            src=$(find "artifacts/binary-${triple}" -type f -name spt -print -quit || true)
            if [[ -z "$src" ]]; then
              echo "::error::no spt binary found under artifacts/binary-${triple}"
              find "artifacts/binary-${triple}" -maxdepth 4 -ls || true
              exit 1
            fi
            cp "$src" "dist/spt-${arch}"
            chmod +x "dist/spt-${arch}"
          done
          ls -l dist/spt-amd64 dist/spt-arm64
      - name: Set up QEMU (arm64 emulation for buildx)
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch docker buildx push
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG:     ${{ steps.bump.outputs.tag }}
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/spt"
          build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # Pass version / revision / date through as build-args so the
          # `org.opencontainers.image.*` LABELs in scripts/docker/Dockerfile
          # carry the right values on the published image.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file scripts/docker/Dockerfile \
            --build-arg VERSION="${TAG}" \
            --build-arg REVISION="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="${build_date}" \
            --tag "${image}:${VERSION}" \
            --tag "${image}:latest" \
            --push \
            .

  # ===========================================================================
  # t7-CCI: Phase C additions
  # ===========================================================================
  # C2: per-recipe packaging smoke (Homebrew, Scoop, Chocolatey, Snap,
  #     Flatpak, AUR, Winget, Nix). Recipes that depend on a published release
  #     artefact run the lightweight local manifest validation on every PR and
  #     the full install path only on `release` events (release-gated).
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # C2: end-to-end packaging smoke tests.
  #
  # Each recipe has its own job so failures are isolated and visible. Every
  # recipe's "local" mode runs on every PR (parse + lint the manifest). The
  # "release" mode (SPT_PKG_RELEASE_MODE=1) which would actually install the
  # package from a published artefact is gated behind `release` events;
  # see each `if:` clause below.
  # ---------------------------------------------------------------------------
  pkg-homebrew:
    name: pkg-homebrew
    # Local-mode validation is `ruby -c` + placeholder lint, which needs no
    # macOS — run on ubuntu so the job isn't stuck waiting for a scarce macOS
    # runner. The real `brew install` smoke (SPT_PKG_RELEASE_MODE=1) only fires
    # on `release` events and would need a macOS runner.
    runs-on: ubuntu-latest
    env:
      SPT_PKG_RELEASE_MODE: ${{ github.event_name == 'release' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            packaging/homebrew
            scripts/package
          filter: blob:none
      - run: bash scripts/package/test-homebrew.sh

  pkg-scoop:
    name: pkg-scoop
    runs-on: windows-2025-vs2026
    env:
      SPT_PKG_RELEASE_MODE: ${{ github.event_name == 'release' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Only the scoop manifest + test script are needed; sparse/blobless
          # checkout avoids pulling the vendored crates (the ~36s checkout was
          # the job's dominant cost).
          sparse-checkout: |
            packaging/scoop
            scripts/package
          filter: blob:none
      - run: ./scripts/package/test-scoop.ps1
        shell: pwsh

  pkg-choco:
    name: pkg-choco
    runs-on: windows-2025-vs2026
    env:
      SPT_PKG_RELEASE_MODE: ${{ github.event_name == 'release' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            packaging/choco
            scripts/package
          filter: blob:none
      - run: ./scripts/package/test-choco.ps1
        shell: pwsh

  pkg-snap:
    name: pkg-snap
    runs-on: ubuntu-latest
    env:
      SPT_PKG_RELEASE_MODE: ${{ github.event_name == 'release' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            packaging/snap
            scripts/package
          filter: blob:none
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml
      - run: bash scripts/package/test-snap.sh

  pkg-flatpak:
    name: pkg-flatpak
    runs-on: ubuntu-latest
    env:
      SPT_PKG_RELEASE_MODE: ${{ github.event_name == 'release' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The flatpak smoke only reads packaging/flatpak + its test script, so
          # a sparse, blobless checkout skips the vendored crates and cuts the
          # ~24s full checkout (the job's dominant cost) to a couple seconds.
          sparse-checkout: |
            packaging/flatpak
            scripts/package
          filter: blob:none
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml
      - run: bash scripts/package/test-flatpak.sh

  pkg-aur:
    name: pkg-aur
    runs-on: ubuntu-latest
    env:
      SPT_PKG_RELEASE_MODE: ${{ github.event_name == 'release' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            packaging/aur
            scripts/package
          filter: blob:none
      - run: bash scripts/package/test-aur.sh

  pkg-winget:
    name: pkg-winget
    # Runs on every PR in local-validation mode (parse + lint the manifest),
    # like the other pkg-* jobs. The real publish to the microsoft/winget-pkgs
    # repo only happens on tagged releases — that is gated by the
    # SPT_PKG_RELEASE_MODE env below (set to 1 only on `release` events), not
    # by the job-level `if:`.
    runs-on: windows-2025-vs2026
    env:
      SPT_PKG_RELEASE_MODE: ${{ github.event_name == 'release' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            packaging/winget
            scripts/package
          filter: blob:none
      - run: ./scripts/package/test-winget.ps1
        shell: pwsh

  pkg-nix:
    name: pkg-nix
    runs-on: ubuntu-latest
    env:
      SPT_PKG_RELEASE_MODE: ${{ github.event_name == 'release' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            packaging/nix
            scripts/package
          filter: blob:none
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: bash scripts/package/test-nix.sh
