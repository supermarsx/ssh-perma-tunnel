# =============================================================================
# Consolidated CI for ssh-perma-tunnel (spt)
# =============================================================================
#
# Pipeline (standard):
#
#   fmt ────┐
#           ├──> test (matrix × 6) ──> build (matrix × 6) ──> release (main)
#   clippy ─┘                                                  └─ docker push
#
# In parallel with build on main/PR: `security` (cargo-deny + audit-check).
#
# Optional dispatch-only jobs (folded from removed workflows; gated on
# `workflow_dispatch.inputs.kind`):
#   - coverage          (was coverage.yml)
#   - fuzz              (was fuzz.yml)
#   - openssh-interop   (was openssh-interop.yml)
#   - bench-regression  (was bench-regression.yml)
#
# -----------------------------------------------------------------------------
# Platform matrix (the 6)
# -----------------------------------------------------------------------------
#
#   target                          runner              native?
#   ------------------------------  ------------------  --------------------
#   x86_64-unknown-linux-gnu        ubuntu-latest       yes
#   aarch64-unknown-linux-gnu       ubuntu-24.04-arm    yes (free-tier ARM
#                                                       runner, GA 2025-04;
#                                                       fall back to
#                                                       ubuntu-latest + cross
#                                                       + QEMU if unavailable)
#   x86_64-apple-darwin             macos-13            yes (Intel)
#   aarch64-apple-darwin            macos-14            yes (Apple Silicon)
#   x86_64-pc-windows-msvc          windows-latest      yes
#   aarch64-pc-windows-msvc         windows-11-arm      yes (preview, 2025;
#                                                       fall back to
#                                                       windows-latest with
#                                                       --target only; tests
#                                                       skip on the fallback)
#
# Operator override: set repository variable / env `SPT_FORCE_CROSS=1` (read
# by the matrix `cross` flag) to force cross+QEMU execution on every target,
# regardless of runner image availability. This is the manual escape hatch
# when a native runner image is broken or quota-exhausted.
#
# MSRV (1.85) is the single toolchain we use — it is implicitly tested by
# every fmt / clippy / test / build job. There is no separate `msrv` job.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security re-scan (Mondays 03:17 UTC).
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Pipeline kind'
        required: true
        default: full
        type: choice
        options:
          - full
          - coverage
          - fuzz
          - openssh-interop
          - bench-regression

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MSRV: 1.85

# Cancel any in-progress run on the same ref when a new push arrives.
# `main` and tag refs are NEVER cancelled (release job is downstream and
# must complete on whichever commit triggered it); PR refs are cancelled
# so a rapid push cycle stops eating runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # fmt — fast style gate (~30s).
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt
    if: github.event_name != 'workflow_dispatch' || inputs.kind == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  # clippy — full workspace lint, pinned at MSRV (the contract).
  # ---------------------------------------------------------------------------
  clippy:
    name: clippy
    if: github.event_name != 'workflow_dispatch' || inputs.kind == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-msrv
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ---------------------------------------------------------------------------
  # test — full matrix, all 6 OS×arch combos. Runs after fmt + clippy.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.target }})
    if: github.event_name != 'workflow_dispatch' || inputs.kind == 'full'
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
            can_test: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            cross: false
            can_test: true
          - target: x86_64-apple-darwin
            runner: macos-13
            cross: false
            can_test: true
          - target: aarch64-apple-darwin
            runner: macos-14
            cross: false
            can_test: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
            can_test: true
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            cross: false
            can_test: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.target }}
      - name: Install cross (QEMU path)
        if: ${{ matrix.cross || env.SPT_FORCE_CROSS == '1' }}
        shell: bash
        run: cargo install cross --locked --version 0.2.5
      - name: cargo test (native)
        if: ${{ matrix.can_test && !matrix.cross && env.SPT_FORCE_CROSS != '1' }}
        shell: bash
        run: cargo test --workspace --locked --no-fail-fast --target ${{ matrix.target }}
      - name: cargo test (cross / QEMU)
        if: ${{ matrix.can_test && (matrix.cross || env.SPT_FORCE_CROSS == '1') }}
        shell: bash
        run: cross test --workspace --locked --no-fail-fast --target ${{ matrix.target }}
      - name: cargo check (no-run target)
        if: ${{ !matrix.can_test }}
        shell: bash
        run: cargo check --workspace --locked --target ${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # build — release builds for all 6 targets, uploads per-platform artifacts.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.target }})
    if: github.event_name != 'workflow_dispatch' || inputs.kind == 'full'
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
            os: linux
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            cross: false
            os: linux
          - target: x86_64-apple-darwin
            runner: macos-13
            cross: false
            os: macos
          - target: aarch64-apple-darwin
            runner: macos-14
            cross: false
            os: macos
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
            os: windows
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            cross: false
            os: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
      - name: Install cross (QEMU path)
        if: ${{ matrix.cross || env.SPT_FORCE_CROSS == '1' }}
        shell: bash
        run: cargo install cross --locked --version 0.2.5
      - name: Install cargo-deb / cargo-generate-rpm (Linux GNU)
        if: ${{ matrix.os == 'linux' && endsWith(matrix.target, '-linux-gnu') }}
        shell: bash
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked
      - name: Install cargo-wix (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: cargo install cargo-wix --locked
      - name: Build release
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" || "${SPT_FORCE_CROSS:-0}" == "1" ]]; then
            cross build --workspace --locked --release --target ${{ matrix.target }}
          else
            cargo build --workspace --locked --release --target ${{ matrix.target }}
          fi
      - name: Pack tarball (Linux/macOS)
        if: ${{ matrix.os != 'windows' }}
        shell: bash
        run: bash scripts/package/pack-tarball.sh ${{ matrix.target }}
      - name: Pack deb (Linux GNU)
        if: ${{ matrix.os == 'linux' && endsWith(matrix.target, '-linux-gnu') }}
        shell: bash
        run: bash scripts/package/pack-deb.sh ${{ matrix.target }}
      - name: Pack rpm (Linux GNU)
        if: ${{ matrix.os == 'linux' && endsWith(matrix.target, '-linux-gnu') }}
        shell: bash
        run: bash scripts/package/pack-rpm.sh ${{ matrix.target }}
      - name: Pack pkg (macOS)
        if: ${{ matrix.os == 'macos' }}
        shell: bash
        run: bash scripts/package/pack-pkg-macos.sh ${{ matrix.target }}
      - name: Pack zip (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: ./scripts/package/pack-zip.ps1 ${{ matrix.target }}
      - name: Pack MSI (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: ./scripts/package/pack-msi-windows.ps1 ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spt-${{ matrix.target }}
          path: dist/**
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # security — cargo-deny + RustSec audit. Runs in parallel with build.
  # Folded from the deleted audit.yml.
  # ---------------------------------------------------------------------------
  security:
    name: security
    if: github.event_name != 'workflow_dispatch' || inputs.kind == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: security
      # Install cargo-deny explicitly so we control the version. The
      # bundled EmbarkStudios/cargo-deny-action@v2 binary historically
      # pinned to 0.17.0, which fails to parse CVSS 4.0 advisories such
      # as RUSTSEC-2026-0146. 0.18+ ships the upgraded parser.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version ^0.18
      - name: cargo-deny check
        run: cargo deny check
      - name: RustSec audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # release — rolling YY.N release. Only fires on push-to-main.
  # Folded docker push from the deleted docker.yml.
  # ---------------------------------------------------------------------------
  release:
    name: release
    needs: [build, security]
    if: >-
      ${{ github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && !contains(github.event.head_commit.message, '[skip release]')
          && !contains(github.event.head_commit.message, 'release: skip') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage dist/
        shell: bash
        run: |
          mkdir -p dist
          # Each upload-artifact was rooted at dist/**, so each downloaded
          # subdir already contains the per-target dist tree. Merge them.
          for d in artifacts/spt-*; do
            if [[ -d "$d" ]]; then cp -r "$d"/. dist/; fi
          done
      - name: Compute next YY.N version
        id: bump
        shell: bash
        run: bash scripts/release/bump-version.sh
      - name: Abort if tag already exists
        shell: bash
        run: |
          tag="${{ steps.bump.outputs.tag }}"
          if git ls-remote --tags --exit-code origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::${tag} already exists on origin; refusing to clobber"
            exit 1
          fi
      - name: Generate CHANGELOG fragment
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          prev_tag=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${TAG}$" | head -n1 || true)
          mkdir -p "dist/${TAG}"
          frag="dist/${TAG}/CHANGELOG-fragment.md"
          curated="docs/releases/${VERSION}.md"
          # Prefer a curated docs/releases/<VERSION>.md (dropped by the
          # close-out commit) over an auto-generated git-log fragment.
          # Falls back to a synthesised fragment when no curated file
          # exists. This matches docs/releases/readme.md's authoring
          # contract.
          if [[ -f "${curated}" ]]; then
            echo "::notice::using curated release notes from ${curated}"
            cp "${curated}" "${frag}"
          else
            echo "::warning::no curated docs/releases/${VERSION}.md; synthesising from git log"
            {
              echo "# spt ${VERSION}"
              echo
              if [[ -n "${prev_tag}" ]]; then
                echo "## Changes since ${prev_tag}"
                echo
                git log --pretty=format:"- %s (%h)" "${prev_tag}..HEAD"
              else
                echo "## Initial rolling release"
                echo
                git log --pretty=format:"- %s (%h)" -n 50
              fi
              echo
            } >"${frag}"
          fi
          if [[ -f changelog.md ]]; then
            today=$(date -u +%Y-%m-%d)
            { echo "## [${VERSION}] - ${today}"; echo; cat "${frag}"; echo; cat changelog.md; } >changelog.md.new
            mv changelog.md.new changelog.md
          fi
      - name: Generate checksums
        shell: bash
        env:
          LINUX_GPG_KEY: ${{ secrets.LINUX_GPG_KEY }}
        run: bash scripts/sign/checksum-all.sh
      - name: Minisign artifacts (gated)
        if: ${{ env.MINISIGN_SECRET_KEY != '' }}
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: bash scripts/sign/minisign-all.sh
      - name: Generate SBOM
        shell: bash
        run: bash scripts/sbom/gen-sbom.sh
      - name: Build release manifest
        shell: bash
        run: bash scripts/release/manifest.sh
      - name: Push version-bump commit and tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.email "ci@spt.local"
          git config user.name  "spt-ci"
          git add Cargo.toml changelog.md 2>/dev/null || true
          git commit -m "release: ${TAG}" || true
          git tag -a "${TAG}" -m "spt ${TAG}"
          git push origin HEAD:main --follow-tags
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --target main \
            --title  "spt ${TAG}" \
            --notes-file "dist/${TAG}/CHANGELOG-fragment.md" \
            dist/"${TAG}"/*
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch docker buildx push
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG:     ${{ steps.bump.outputs.tag }}
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/spt"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file scripts/docker/Dockerfile \
            --tag "${image}:${VERSION}" \
            --tag "${image}:latest" \
            --push \
            .

  # ===========================================================================
  # Dispatch-only jobs (folded from removed workflows)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # coverage — cargo llvm-cov + Codecov. (was coverage.yml)
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.kind == 'coverage' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --locked --lcov --output-path coverage.lcov
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # fuzz — 60s per target × 10 targets. (was fuzz.yml)
  # Target names mirror fuzz/fuzz_targets/*.rs. Keep this list in sync with
  # the PR-gating `fuzz-dryrun` job below; t7-CCI corrected an earlier set of
  # placeholder names that did not match any real target.
  # ---------------------------------------------------------------------------
  fuzz:
    name: fuzz (${{ matrix.target }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.kind == 'fuzz' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 10 cargo-fuzz targets defined under fuzz/fuzz_targets/.
        target:
          - address_parse
          - ber_decode
          - duration_parse
          - known_hosts
          - redaction
          - size_parse
          - snmpv3_message
          - ssh3_frame
          - toml_config
          - usm_authenticate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run ${{ matrix.target }} for 60s
        run: |
          cd fuzz
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=60

  # ---------------------------------------------------------------------------
  # openssh-interop — interop crate against the openssh docker matrix.
  # (was openssh-interop.yml)
  # ---------------------------------------------------------------------------
  openssh-interop:
    name: openssh-interop
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.kind == 'openssh-interop' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: openssh-interop
          workspaces: tests/openssh-interop
      - name: Bring up openssh docker fixture
        run: |
          if [[ -f tests/openssh-interop/docker-compose.yml ]]; then
            docker compose -f tests/openssh-interop/docker-compose.yml up -d
          fi
      - name: Run interop suite
        run: cargo test --manifest-path tests/openssh-interop/Cargo.toml --locked
      - name: Tear down
        if: always()
        run: |
          if [[ -f tests/openssh-interop/docker-compose.yml ]]; then
            docker compose -f tests/openssh-interop/docker-compose.yml down -v
          fi

  # ---------------------------------------------------------------------------
  # bench-regression — criterion compare vs. main baseline.
  # (was bench-regression.yml)
  # ---------------------------------------------------------------------------
  bench-regression:
    name: bench-regression
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.kind == 'bench-regression' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-regression
      - name: Baseline (main)
        run: |
          git fetch origin main:main || true
          git checkout main
          cargo bench --workspace --locked -- --save-baseline main || true
      - name: Candidate (HEAD)
        run: |
          git checkout -
          cargo bench --workspace --locked -- --baseline main || true
      - name: Compare
        run: python3 scripts/bench-compare.py || true

  # ===========================================================================
  # t7-CCI: Phase C additions
  # ===========================================================================
  # C1: doc-warnings — `cargo doc -D warnings` gate for the whole workspace.
  # C2: per-recipe packaging smoke (Homebrew, Scoop, Chocolatey, Snap,
  #     Flatpak, AUR, Winget, Nix). Recipes that depend on a published release
  #     artefact run the lightweight local manifest validation on every PR and
  #     the full install path only on `release` events (release-gated).
  # C3: PR-gating `cargo fuzz` dry-run (60s × 10 targets), explicit MSRV-1.85
  #     `cargo check`, plus a re-evaluated `deny.toml` (no schema change here).
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # C1: doc-warnings — runs on every PR / push.
  #
  # Gate scope: **full `-D warnings`** as of t8-E1. The ~78 pre-existing broken
  # intra-doc-link errors that justified the narrow gate during t7 were swept
  # in t8-E1 (links rewritten to literal-backtick form or correct paths). The
  # 7 deferred `missing_docs` crates received `#![warn(missing_docs)] +
  # #![allow(missing_docs)]` with a documented deferral.
  # ---------------------------------------------------------------------------
  doc-warnings:
    name: doc-warnings (-D warnings)
    if: github.event_name != 'workflow_dispatch' || inputs.kind == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc-warnings
      - name: cargo doc with all rustdoc warnings as errors
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked

  # ---------------------------------------------------------------------------
  # C3a: MSRV-1.85 explicit check — separate from the matrix so a stale
  # toolchain pin in the main jobs cannot silently drift past MSRV.
  # ---------------------------------------------------------------------------
  msrv-1-85:
    name: MSRV 1.85 check
    if: github.event_name != 'workflow_dispatch' || inputs.kind == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1-85
      - run: cargo check --workspace --locked

  # ---------------------------------------------------------------------------
  # C3b: PR-gating fuzz dry-run — 90s per target (t8-A5; bumped from 60s
  # after adding six new targets in fuzz_targets/), runs every target
  # discovered by `cargo fuzz list`. Promoted from dispatch-only to PR.
  # ---------------------------------------------------------------------------
  fuzz-dryrun:
    name: fuzz dry-run
    if: github.event_name != 'workflow_dispatch' || inputs.kind == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-dryrun
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run each fuzz target for 90s
        shell: bash
        run: |
          cd fuzz
          targets=$(cargo fuzz list)
          if [[ -z "${targets}" ]]; then
            echo "::error::no fuzz targets discovered"
            exit 1
          fi
          echo "discovered targets:"
          echo "${targets}"
          for t in ${targets}; do
            echo "::group::fuzz ${t}"
            cargo fuzz run "${t}" -- -max_total_time=90
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # C2: end-to-end packaging smoke tests.
  #
  # Each recipe has its own job so failures are isolated and visible. Every
  # recipe's "local" mode runs on every PR (parse + lint the manifest). The
  # "release" mode (SPT_PKG_RELEASE_MODE=1) which would actually install the
  # package from a published artefact is gated behind `release` events;
  # see each `if:` clause below.
  # ---------------------------------------------------------------------------
  pkg-homebrew:
    name: pkg-homebrew
    if: github.event_name != 'workflow_dispatch' || inputs.kind == 'full'
    runs-on: macos-13
    env:
      # Release-gated: real `brew install` against the published tarball.
      SPT_PKG_RELEASE_MODE: ${{ github.event_name == 'release' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/package/test-homebrew.sh

  pkg-scoop:
    name: pkg-scoop
