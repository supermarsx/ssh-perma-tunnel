name: OpenSSH Interop

# Real OpenSSH-server interop tests (Linux + Docker only).
# Runs on PRs that touch interop-relevant code, plus weekly schedule and
# manual dispatch.

on:
  push:
    branches: [main]
    paths:
      - "tests/openssh-interop/**"
      - "crates/spt-ssh2/**"
      - "crates/spt-bin/**"
      - "crates/spt-supervisor/**"
      - "crates/spt-forward/**"
      - ".github/workflows/openssh-interop.yml"
  pull_request:
    branches: [main]
    paths:
      - "tests/openssh-interop/**"
      - "crates/spt-ssh2/**"
      - "crates/spt-bin/**"
      - "crates/spt-supervisor/**"
      - "crates/spt-forward/**"
      - ".github/workflows/openssh-interop.yml"
  schedule:
    # Mondays 06:13 UTC — off the hour to dodge GitHub Actions queue spikes.
    - cron: "13 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  interop:
    name: openssh-interop (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.83.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: openssh-interop

      # Build the spt binary that the tests will subprocess. Use --locked
      # so we honour the workspace lockfile (MSRV-1.83 contract).
      - name: Build spt binary
        run: cargo build -p spt-bin --release --locked --features ssh2-vendored-openssl

      # Generate fresh fixture keypairs (deterministic per-run, never
      # committed). ssh-keygen is preinstalled on ubuntu-latest.
      - name: Generate SSH fixtures
        run: sh tests/openssh-interop/fixtures/gen-fixtures.sh

      # Boot the docker stack. The compose file pins images to a specific
      # ls.* tag so test behaviour doesn't drift if the upstream tag is
      # republished.
      - name: Start sshd containers
        run: docker compose -f tests/openssh-interop/docker-compose.yml up -d

      # Wait for both sshd ports to accept TCP. Bash one-liner; failing
      # fast here gives a clearer error than letting every test time out.
      - name: Wait for sshd ports
        run: |
          for port in 2222 2223; do
            for i in $(seq 1 60); do
              if nc -z 127.0.0.1 "$port"; then
                echo "port $port up after ${i}s"
                break
              fi
              sleep 1
              if [ "$i" = "60" ]; then
                echo "port $port never came up" >&2
                docker compose -f tests/openssh-interop/docker-compose.yml logs
                exit 1
              fi
            done
          done

      # Build the standalone test crate using its own (separate) lockfile.
      # We use `--locked` so MSRV stays honoured, and `cd` into the crate
      # so cargo doesn't try to pick up the parent workspace.
      - name: Build interop test crate
        working-directory: tests/openssh-interop
        run: cargo build --locked --tests

      - name: Run interop tests
        working-directory: tests/openssh-interop
        env:
          SPT_OPENSSH_INTEROP: "1"
          SPT_BIN: ${{ github.workspace }}/target/release/spt
          # `172.17.0.1` is the default Linux docker bridge gateway —
          # the address each sshd container sees the host on. Override
          # via SPT_HOST_GATEWAY if the runner image picks a different
          # bridge subnet.
          SPT_HOST_GATEWAY: "172.17.0.1"
        run: cargo test --locked -- --ignored --nocapture

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f tests/openssh-interop/docker-compose.yml logs

      - name: Stop sshd containers
        if: always()
        run: docker compose -f tests/openssh-interop/docker-compose.yml down -v
