name: Docker

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  docker:
    name: build-and-push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: docker-multiarch
      - name: Install cross
        run: cargo install cross --locked --version 0.2.5
      - name: Build amd64 binary
        run: bash scripts/build/build-target.sh x86_64-unknown-linux-musl
      - name: Build arm64 binary
        run: bash scripts/build/build-target.sh aarch64-unknown-linux-musl
      - name: Stage binaries for buildx
        run: |
          mkdir -p dist/spt-linux-amd64 dist/spt-linux-arm64
          cp target/x86_64-unknown-linux-musl/release/spt dist/spt-linux-amd64/spt
          cp target/aarch64-unknown-linux-musl/release/spt dist/spt-linux-arm64/spt
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            --tag ghcr.io/${{ github.repository }}:latest \
            --push \
            -f scripts/docker/Dockerfile .
