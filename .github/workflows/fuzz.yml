name: Fuzz

on:
  pull_request:
    paths:
      - 'crates/spt-config/src/**'
      - 'crates/spt-snmp/src/**'
      - 'crates/spt-ssh3/src/frame.rs'
      - 'crates/spt-core/src/**'
      - 'crates/spt-trust/src/**'
      - 'fuzz/**'
  schedule:
    # Weekly long-budget run (Sundays 05:23 UTC).
    - cron: '23 5 * * 0'
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - toml_config
          - ber_decode
          - snmpv3_message
          - usm_authenticate
          - ssh3_frame
          - address_parse
          - duration_parse
          - size_parse
          - redaction
          - known_hosts
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: |
          # 60s per target on PRs; 30 minutes on the weekly schedule.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            BUDGET=1800
          else
            BUDGET=60
          fi
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=$BUDGET

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/**
          if-no-files-found: ignore
