[package]
name = "spt-e2e-tests"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Workspace-level end-to-end integration tests for spt."

[lints]
workspace = true

# An empty library is required so cargo treats this as a real package; the
# tests below live under `e2e/` (not the cargo-conventional `tests/` dir)
# because the brief's layout names the directory `e2e/`. Each file is wired
# explicitly via a `[[test]]` entry.
[lib]
path = "support/mod.rs"

[[test]]
name = "reload_diff"
path = "e2e/reload_diff.rs"

[[test]]
name = "ssh2_local_forward"
path = "e2e/ssh2_local_forward.rs"

[[test]]
name = "ssh2_remote_forward"
path = "e2e/ssh2_remote_forward.rs"

[[test]]
name = "ssh2_reconnect"
path = "e2e/ssh2_reconnect.rs"

[[test]]
name = "ssh2_multi_forward"
path = "e2e/ssh2_multi_forward.rs"

[[test]]
name = "ssh2_keepalive"
path = "e2e/ssh2_keepalive.rs"

[[test]]
name = "cfgcrypt_tunnel_up"
path = "e2e/cfgcrypt_tunnel_up.rs"

# t-e2e Waves B-G: six new targets registered up-front as empty-but-valid
# placeholders so parallel content executors can fill the `.rs` files WITHOUT
# touching this manifest. See `.orchestration/plans/t-e2e.md`.
[[test]]
name = "ssh2_dynamic_udp_hops"
path = "e2e/ssh2_dynamic_udp_hops.rs"

[[test]]
name = "remote_config_reload"
path = "e2e/remote_config_reload.rs"

[[test]]
name = "ssh3_supervised_serve"
path = "e2e/ssh3_supervised_serve.rs"

[[test]]
name = "health_probes"
path = "e2e/health_probes.rs"

[[test]]
name = "obfs_secret_tunnel"
path = "e2e/obfs_secret_tunnel.rs"

[[test]]
name = "update_eventsink"
path = "e2e/update_eventsink.rs"

# `dependencies` (NOT dev-dependencies) so the lib in `support/mod.rs` —
# which re-exports the SharedLogProtocol used by every ssh2_*.rs test —
# can compile against them. Tests link both the lib and the dev-deps below.
[dependencies]
spt-auth = { workspace = true }
spt-core = { workspace = true }
spt-forward = { workspace = true, features = ["testing"] }
spt-protocol = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
# Only the dependencies actually exercised by the shipped tests are listed.
# The brief named more (assert_cmd, predicates, spt-ssh2/spt-key/spt-secrets/
# spt-auth/etc.); they are intentionally omitted because the corresponding
# tests are not shipped -- see `.orchestration/state.md` Escalations:
# "f-e2e-russh" for rationale (libssh2-vs-russh interop is `#[ignore]`'d at
# baseline; assert_cmd is MSRV-1.83 blocked per t1-e18 log).
spt-config = { workspace = true, features = ["testing"] }
spt-supervisor = { workspace = true, features = ["testing"] }
spt-protocol = { workspace = true }
spt-auth = { workspace = true }
spt-core = { workspace = true }
spt-forward = { workspace = true, features = ["testing"] }
# Real russh<->russh e2e forwarding/reconnect coverage (GAP 4) drives the
# `Ssh2Protocol` backend against the embedded `RusshTestServer` fixture, both
# of which live behind spt-ssh2's `testing` feature.
spt-ssh2 = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["full"] }
parking_lot = { workspace = true }
# Config-crypt true e2e (`cfgcrypt_tunnel_up.rs`): seal/unseal + the
# remote-config fetch+pin seam + sha256 pin + secret expose. All are internal
# path/workspace edges to crates already in the graph — no version bump.
spt-config-crypt = { workspace = true }
spt-remote-config = { workspace = true }
secrecy = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# t-e2e Waves C-F dev-deps. All are existing workspace members already in the
# graph/lock — additive edges only, NO new package, NO version bump. The
# `testing` feature is enabled where the crate gates its test fixtures behind
# it (verified each crate's `[features]`):
#   spt-ssh3   — Ssh3TestServer/serve() (Wave C)
#   spt-obfs   — obfs acceptor/MockAuditHook fixtures (Wave E)
#   spt-secrets— vault/keychain test backends (Wave E)
#   spt-key    — key fixtures (rand_chacha/tempfile) (Wave E)
#   spt-updater— mock ReleaseSource (Wave F; feature declared, body TBD by executor)
#   spt-events — CapturingSink/AlwaysFailSink (Wave F)
# Multi-hop (Wave B) needs no new crate: it chains multiple `RusshTestServer`s
# from spt-ssh2 (already a dev-dep above). `spt-chaos-proxy` is NOT added — it
# has no `testing` feature and is not required by the planned tests.
spt-ssh3 = { workspace = true, features = ["testing"] }
spt-obfs = { workspace = true, features = ["testing"] }
spt-secrets = { workspace = true, features = ["testing"] }
spt-key = { workspace = true, features = ["testing"] }
spt-updater = { workspace = true, features = ["testing"] }
spt-events = { workspace = true, features = ["testing"] }
