# Docker compose for the OpenSSH-interop test harness.
#
# Two openssh-server containers:
#   * sshd-ed25519  — port 2222 host-side, ED25519 host key, pubkey + password
#   * sshd-rsa      — port 2223 host-side, RSA host key, pubkey only
#
# Both containers are seeded from `./fixtures/`:
#   * `fixtures/keys/` holds the deterministic test keypairs (generated by
#     `scripts/gen-fixtures.sh`, see README in the same directory).
#   * `fixtures/host_keys/` holds the deterministic SSH host keys.
#   * `fixtures/sshd_config.d/` is overlay config for the embedded sshd.
#
# Both servers also act as ProxyJump intermediates for each other in the
# multi-hop test (`proxy_jump.rs`).
#
# Usage:
#   docker compose -f tests/openssh-interop/docker-compose.yml up -d
#   # ... run tests ...
#   docker compose -f tests/openssh-interop/docker-compose.yml down -v

services:
  sshd-ed25519:
    image: linuxserver/openssh-server:9.7_p1-r4-ls184
    container_name: spt-interop-sshd-ed25519
    hostname: sshd-ed25519
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - PUBLIC_KEY_FILE=/fixtures/keys/test_ed25519.pub
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=interop-pw
      - USER_NAME=interop
      - LOG_STDOUT=true
    volumes:
      - ./fixtures:/fixtures:ro
      - ./fixtures/host_keys/ssh_host_ed25519_key:/config/ssh_host_keys/ssh_host_ed25519_key:ro
      - ./fixtures/host_keys/ssh_host_ed25519_key.pub:/config/ssh_host_keys/ssh_host_ed25519_key.pub:ro
    ports:
      - "127.0.0.1:2222:2222"
    # The image's healthcheck is "is sshd accepting on 2222". We rely on
    # the Rust harness to poll-connect rather than embedding one here.
    networks:
      interop:
        aliases:
          - sshd-ed25519

  sshd-rsa:
    image: linuxserver/openssh-server:9.7_p1-r4-ls184
    container_name: spt-interop-sshd-rsa
    hostname: sshd-rsa
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - PUBLIC_KEY_FILE=/fixtures/keys/test_rsa.pub
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=false
      - USER_NAME=interop
      - LOG_STDOUT=true
    volumes:
      - ./fixtures:/fixtures:ro
      - ./fixtures/host_keys/ssh_host_rsa_key:/config/ssh_host_keys/ssh_host_rsa_key:ro
      - ./fixtures/host_keys/ssh_host_rsa_key.pub:/config/ssh_host_keys/ssh_host_rsa_key.pub:ro
    ports:
      - "127.0.0.1:2223:2222"
    networks:
      interop:
        aliases:
          - sshd-rsa

networks:
  interop:
    driver: bridge
