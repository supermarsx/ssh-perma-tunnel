# Standalone interop crate that drives `crates/spt-obfs`'s shadowsocks
# transport against a real `shadowsocks-rust` subprocess (`ssserver`).
#
# Detached workspace (mirrors the sibling openssh-interop/Cargo.toml
# pattern) so `cargo build --workspace` from the project root never tries
# to pull in `shadowsocks-rust` toolchain assumptions.
#
# Tests gate themselves on `SPT_SS_INTEROP=1` AND on `ssserver` being on
# `$PATH`; without both, the body returns early and the test passes as a
# no-op. To run:
#
#   $env:SPT_SS_INTEROP = "1"
#   cargo test --manifest-path tests/openssh-interop/shadowsocks/Cargo.toml \
#       --test ss_2022_interop

[workspace]

[package]
name = "ss-interop"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Shadowsocks-2022 BLAKE3 KDF interop against shadowsocks-rust ssserver."

[lib]
path = "src/lib.rs"

[[test]]
name = "ss_2022_interop"
path = "tests/ss_2022_interop.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
anyhow = "1"
# Pin which to 4.x to keep MSRV ≤ 1.85; newer versions of `home`/`idna`
# transitively require rustc 1.86+.
which = "4"
spt-obfs = { path = "../../../crates/spt-obfs", features = ["testing"] }
spt-core = { path = "../../../crates/spt-core" }
spt-secrets = { path = "../../../crates/spt-secrets" }
blake3 = "1"
base64 = "0.22"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
