# Standalone test crate that exercises the built `spt` binary against a
# real OpenSSH server (via `linuxserver/openssh-server` Docker images).
#
# This crate is intentionally NOT a workspace member of the parent
# `ssh-perma-tunnel` workspace — running these tests requires Docker, an
# explicit `SPT_OPENSSH_INTEROP=1` opt-in, and a pre-built `spt` binary.
# Wiring it into the parent workspace would force the rest of the test
# matrix (which has no Docker) to compile this dev-dep tree on every
# `cargo build --workspace`.
#
# The empty `[workspace]` table tells Cargo this directory is its own
# workspace and stops it from auto-attaching to the parent.

[workspace]

[package]
name = "openssh-interop"
version = "0.0.0"
edition = "2021"
rust-version = "1.83"
publish = false
license = "MIT"
description = "OpenSSH-server interop tests for the `spt` CLI."

[lib]
path = "src/lib.rs"

# Each test file is wired explicitly so the file list is auditable from
# Cargo.toml without grepping the filesystem.
[[test]]
name = "auth_pubkey"
path = "tests/auth_pubkey.rs"

[[test]]
name = "auth_password"
path = "tests/auth_password.rs"

[[test]]
name = "host_keys"
path = "tests/host_keys.rs"

[[test]]
name = "forward_local"
path = "tests/forward_local.rs"

[[test]]
name = "forward_remote"
path = "tests/forward_remote.rs"

[[test]]
name = "pinning"
path = "tests/pinning.rs"

[[test]]
name = "keepalive"
path = "tests/keepalive.rs"

[[test]]
name = "proxy_jump"
path = "tests/proxy_jump.rs"

[dependencies]
# Runtime: full features for spawn + I/O + time.
tokio = { version = "1.40", features = ["full"] }
# Tempdirs for per-test config + key material.
# Pinned to <=3.13: tempfile 3.14+ pulls rustix 1.x which depends on
# getrandom 0.4 (edition2024, requires Rust 1.85). 3.13 stays on rustix
# 0.38 + getrandom 0.2 which compile under MSRV 1.83.
tempfile = "=3.13.0"
# Anyhow gives us ergonomic `?` in helper code; tests still use plain
# `assert!` / `panic!` so failure messages remain inline.
anyhow = "1"

[dev-dependencies]
# Tests reuse the lib helpers; no extra dev-only deps needed.
tokio = { version = "1.40", features = ["full"] }
