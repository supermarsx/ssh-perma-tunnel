# Conformance-test overrides for the linuxserver/openssh-server image.
#
# Default linuxserver image disables password auth and clamps forwarding;
# the matrix harness needs both forward directions and both auth methods.

PasswordAuthentication yes
PubkeyAuthentication   yes
PermitRootLogin        no

AllowTcpForwarding     yes
GatewayPorts           clientspecified
AllowAgentForwarding   no

# Logging help when a cell unexpectedly fails.
LogLevel               VERBOSE
