
version = 1
[[profiles]]
name = "rfwd"
enabled = true
protocol = "ssh2"
host = "h"
port = 22
user = "u"
[profiles.auth]
method = "agent"
[profiles.trust]
mode = "known_hosts"
strict = true
[[profiles.forwards]]
name = "rf1"
type = "remote"
transport = "tcp"
bind = "0.0.0.0:9000"
target = "127.0.0.1:9000"
target_resolve = "local"
