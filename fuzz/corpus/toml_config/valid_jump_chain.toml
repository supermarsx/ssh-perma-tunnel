
version = 1
[[profiles]]
name = "jump"
enabled = true
protocol = "ssh2"
host = "j1"
port = 22
user = "u"
[profiles.auth]
method = "agent"
[profiles.trust]
mode = "known_hosts"
strict = true
[[profiles.hops]]
name = "j2"
protocol = "ssh2"
host = "j2"
port = 22
user = "u"
target_resolve = "previous-hop"
[[profiles.hops]]
name = "j3"
protocol = "ssh2"
host = "j3"
port = 22
user = "u"
target_resolve = "previous-hop"
