# Multi-hop SSH2 chain — see spec.md §8.2.
version = 1

[[profiles]]
name = "two-hop-admin"
enabled = true
protocol = "ssh2"
host = "jump1.example.com"
port = 22
user = "ops"

[profiles.auth]
method = "agent"

[profiles.trust]
mode = "known_hosts"
strict = true

[[profiles.hops]]
name = "jump2"
protocol = "ssh2"
host = "jump2.internal"
port = 22
user = "ops"
target_resolve = "previous-hop"

[[profiles.forwards]]
name = "admin-ui"
type = "local"
transport = "tcp"
bind = "127.0.0.1:18443"
target = "admin.internal:443"
target_resolve = "remote"
required = true
