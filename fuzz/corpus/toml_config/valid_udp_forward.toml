
version = 1
[[profiles]]
name = "udpfwd"
enabled = true
protocol = "ssh3"
acknowledge_experimental = true
endpoint = "https://h:443/ssh3"
user = "u"
[profiles.auth]
method = "bearer_token"
token = "x"
[profiles.tls]
server_name = "h"
system_roots = true
[profiles.ssh3]
enable_datagrams = true
[[profiles.forwards]]
name = "dns"
type = "local"
transport = "udp"
bind = "127.0.0.1:1053"
target = "1.1.1.1:53"
udp_idle_timeout = "30s"
