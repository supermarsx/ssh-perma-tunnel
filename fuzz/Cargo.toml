# -----------------------------------------------------------------------------
# t8-A5: 8 new fuzz targets called out by t8.md. Six were viable against the
# current source; two were dropped because the plan's documented entry point
# does not exist in the codebase (see `.orchestration/logs/t8-A5.md` for the
# full discovery audit):
#
#   * ssh3_jwt_jose_header — `spt-ssh3::jwt` only *builds* JWTs; there is no
#     `JoseHeader::parse` or equivalent decode path. Skipped.
#   * forward_spec_parse   — there is no OpenSSH-style `-L host:port:host:port`
#     parser in `spt-config::schema` or anywhere else; `Forward` round-trips
#     through serde TOML, which is already covered by the `toml_config` target.
#     Skipped.
#
# The remaining six map to the plan as follows:
#
#   target                    | mapped entry point
#   --------------------------|--------------------------------------------------
#   socks5_negotiate          | spt_ssh2::proxy_jump::socks5_connect (async,
#                             |   driven via a ReplayStream `AsyncRead`)
#   http_connect_request      | spt_ssh2::proxy_jump::http_connect (same shape)
#   ftp_verb_parse            | spt_ftp_translator::verbs::parse_command
#   openssh_config_parse      | spt_config::openssh_config::parse
#   obfs4_frame_decode        | spt_obfs::obfs4::open_frame (fixed key+nonce)
#   shadowsocks_aead_decrypt  | spt_obfs::shadowsocks::ShadowsocksTransport::open
#                             |   (fixed password injected via
#                             |    with_direct_password)
# -----------------------------------------------------------------------------

[[bin]]
name = "socks5_negotiate"
path = "fuzz_targets/socks5_negotiate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_connect_request"
path = "fuzz_targets/http_connect_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ftp_verb_parse"
path = "fuzz_targets/ftp_verb_parse.rs"
test = false
