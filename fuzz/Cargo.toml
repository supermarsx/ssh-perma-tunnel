[package]
name = "spt-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Empty workspace block: this fuzz crate is its own workspace, decoupled from
# the main one, so cargo-fuzz can use a different toolchain (nightly) without
# affecting the main MSRV-1.83 contract. The main workspace excludes "fuzz".
#
# t8-A5: resolver = "2" matches the main workspace and is required for the
# new fuzz targets that depend on spt-ssh2/spt-obfs/spt-ftp-translator. The
# resolver-1 default unifies feature sets across host+target which yields a
# spurious `Send` bound mismatch in `russh_backend::connect` when the fuzz
# workspace re-derives spt-ssh2's feature universe.
[workspace]
resolver = "2"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
bytes = "1"
# t8-A5: tokio is required by the socks5_negotiate + http_connect_request
# fuzz targets, which drive the async proxy-jump client over an
# in-memory AsyncRead/AsyncWrite replay stream. `rt` is the only feature
# needed (the targets build a current-thread runtime themselves).
tokio = { version = "1", features = ["rt", "io-util", "macros"] }

spt-core = { path = "../crates/spt-core" }
spt-config = { path = "../crates/spt-config" }
spt-snmp = { path = "../crates/spt-snmp" }
spt-ssh3 = { path = "../crates/spt-ssh3" }
spt-trust = { path = "../crates/spt-trust" }
# t8-A5: new fuzz targets reach into proxy-jump (spt-ssh2), the FTP verb
# parser (spt-ftp-translator), AEAD framing (spt-obfs), and the SecretRef
# parser (spt-secrets). All four crates are already in the workspace
# lockfile via spt-bin / spt-supervisor / spt-cli, so adding direct
# fuzz-only paths does not trigger `cargo update`.
spt-ssh2 = { path = "../crates/spt-ssh2" }
spt-ftp-translator = { path = "../crates/spt-ftp-translator" }
spt-obfs = { path = "../crates/spt-obfs" }
spt-secrets = { path = "../crates/spt-secrets" }

# t8-A5: replicate the main workspace's `[patch.crates-io]` redirect so the
# fuzz workspace builds against the vendored russh fork (which carries the
# corrected Send bounds in `russh_backend::connect`). Without this patch
# block the fuzz workspace pulls upstream russh 0.46.0 from crates.io and
# `spt-ssh2` fails to compile with a spurious `std::marker::Send is not
# general enough` error.
[patch.crates-io]
russh = { path = "../vendor/russh-fork/russh" }
russh-keys = { path = "../vendor/russh-fork/russh-keys" }
russh-cryptovec = { path = "../vendor/russh-fork/cryptovec" }

[[bin]]
name = "toml_config"
path = "fuzz_targets/toml_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ber_decode"
path = "fuzz_targets/ber_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snmpv3_message"
path = "fuzz_targets/snmpv3_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "usm_authenticate"
path = "fuzz_targets/usm_authenticate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ssh3_frame"
path = "fuzz_targets/ssh3_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "address_parse"
path = "fuzz_targets/address_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "duration_parse"
path = "fuzz_targets/duration_parse.rs"
test = false
doc = false
