[package]
name = "spt-fuzz-generators"
version = "0.0.0"
edition = "2021"
publish = false

# Decoupled, like fuzz/ — its own workspace so it can move independently.
[workspace]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
spt-config = { path = "../../crates/spt-config" }
spt-snmp = { path = "../../crates/spt-snmp" }
spt-ssh3 = { path = "../../crates/spt-ssh3" }
spt-core = { path = "../../crates/spt-core" }
spt-trust = { path = "../../crates/spt-trust" }
serde = "1"
toml = "0.8"
bytes = "1"

[[bin]]
name = "gen-toml-config"
path = "src/bin/gen-toml-config.rs"

[[bin]]
name = "gen-ber"
path = "src/bin/gen-ber.rs"

[[bin]]
name = "gen-snmpv3-message"
path = "src/bin/gen-snmpv3-message.rs"

[[bin]]
name = "gen-usm"
path = "src/bin/gen-usm.rs"

[[bin]]
name = "gen-ssh3-frame"
path = "src/bin/gen-ssh3-frame.rs"

[[bin]]
name = "gen-known-hosts"
path = "src/bin/gen-known-hosts.rs"

[[bin]]
name = "gen-addresses"
path = "src/bin/gen-addresses.rs"

[[bin]]
name = "gen-durations"
path = "src/bin/gen-durations.rs"

[[bin]]
name = "gen-sizes"
path = "src/bin/gen-sizes.rs"

[[bin]]
name = "gen-redact"
path = "src/bin/gen-redact.rs"
