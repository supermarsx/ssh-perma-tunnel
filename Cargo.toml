[workspace]
resolver = "2"
members = [
    "crates/spt-bin",
    "crates/spt-core",
    "crates/spt-config",
    "crates/spt-secrets",
    "crates/spt-protocol",
    "crates/spt-ssh2",
    "crates/spt-ssh3",
    "crates/spt-forward",
    "crates/spt-supervisor",
    "crates/spt-state",
    "crates/spt-net",
    "crates/spt-firewall",
    "crates/spt-dns",
    "crates/spt-events",
    "crates/spt-observability",
    "crates/spt-snmp",
    "crates/spt-winevent",
    "crates/spt-service",
    "crates/spt-key",
    "crates/spt-trust",
    "crates/spt-auth",
    "crates/spt-stats",
    "crates/spt-diagnostics",
    "crates/spt-benchmark",
    "crates/spt-mcp",
    "crates/spt-tui",
    "crates/spt-cli",
    "crates/spt-remote-config",
    "tests",
    "tests/conformance",
    "tests/stress",
]
default-members = ["crates/spt-bin"]
# The fuzz crate is its own decoupled workspace (cargo-fuzz convention) so it
# can be built with nightly without affecting the main MSRV-1.83 contract.
# tests/property and tests/openssh-interop are intentionally NOT members:
# each ships its own [workspace] table + Cargo.lock to pin MSRV-1.83-clean
# versions of `arbitrary`/`tempfile` independent of the root resolver
# (per t2-e7 and t2-e2 executor logs). They are exercised standalone via
# `cargo test --manifest-path tests/<name>/Cargo.toml`.
exclude = ["fuzz", "tests/property", "tests/openssh-interop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/Mariana/ssh-perma-tunnel"
homepage = "https://github.com/Mariana/ssh-perma-tunnel"
authors = ["Mariana"]
description = "Permanent SSH2/SSH3 tunnels with reconnect, observability, and service integration."
readme = "README.md"

[workspace.dependencies]
# Internal crates
spt-core = { path = "crates/spt-core", version = "0.1.0" }
spt-config = { path = "crates/spt-config", version = "0.1.0" }
spt-secrets = { path = "crates/spt-secrets", version = "0.1.0" }
spt-protocol = { path = "crates/spt-protocol", version = "0.1.0" }
spt-ssh2 = { path = "crates/spt-ssh2", version = "0.1.0" }
spt-ssh3 = { path = "crates/spt-ssh3", version = "0.1.0" }
spt-forward = { path = "crates/spt-forward", version = "0.1.0" }
spt-supervisor = { path = "crates/spt-supervisor", version = "0.1.0" }
spt-state = { path = "crates/spt-state", version = "0.1.0" }
spt-net = { path = "crates/spt-net", version = "0.1.0" }
spt-firewall = { path = "crates/spt-firewall", version = "0.1.0" }
spt-dns = { path = "crates/spt-dns", version = "0.1.0" }
spt-events = { path = "crates/spt-events", version = "0.1.0" }
spt-observability = { path = "crates/spt-observability", version = "0.1.0" }
spt-snmp = { path = "crates/spt-snmp", version = "0.1.0" }
spt-winevent = { path = "crates/spt-winevent", version = "0.1.0" }
spt-service = { path = "crates/spt-service", version = "0.1.0" }
spt-key = { path = "crates/spt-key", version = "0.1.0" }
spt-trust = { path = "crates/spt-trust", version = "0.1.0" }
spt-auth = { path = "crates/spt-auth", version = "0.1.0" }
spt-stats = { path = "crates/spt-stats", version = "0.1.0" }
spt-diagnostics = { path = "crates/spt-diagnostics", version = "0.1.0" }
spt-benchmark = { path = "crates/spt-benchmark", version = "0.1.0" }
spt-mcp = { path = "crates/spt-mcp", version = "0.1.0" }
spt-tui = { path = "crates/spt-tui", version = "0.1.0" }
spt-cli = { path = "crates/spt-cli", version = "0.1.0" }
spt-remote-config = { path = "crates/spt-remote-config", version = "0.1.0" }

# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
# Pinned to 0.2.31: 0.2.32 pulls roff 1.x (edition2024); 0.2.33+ requires Rust 1.85.
# 0.2.31 declares rust-version 1.74 and depends on roff ^0.2.1 (rust-version 1.70).
clap_mangen = "=0.2.31"

# Serde / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"
humantime = "2"
humantime-serde = "1"
bytesize = "1"
serde_ignored = "0.1"

# Errors / diagnostics
thiserror = "1"
miette = { version = "7", features = ["fancy"] }
anyhow = "1"

# Logging / tracing / metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
tracing-journald = "0.3"
opentelemetry = "0.24"
opentelemetry-otlp = { version = "0.17", default-features = false, features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio", "trace", "metrics", "logs"] }
prometheus = "0.14"

# Filesystem / paths
directories = "5"
notify = "6"
notify-debouncer-full = "0.3"
fs4 = "0.9"
atomicwrites = "0.4"
tempfile = "3"

# Crypto / secrets
zeroize = { version = "1.7", features = ["zeroize_derive"] }
secrecy = "0.10"
keyring = "3"
aes-gcm = "0.10"
aes = "0.8"
cfb-mode = "0.8"
argon2 = "0.5"
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
subtle = "2"
bytes = "1"

# SSH / networking transports
# async-ssh2-lite wraps libssh2 via Tokio AsyncFd; ssh2 crate is the underlying FFI binding.
# NOTE: `vendored-openssl` is deliberately NOT enabled. On Windows
# libssh2-sys's build script falls back to LIBSSH2_WINCNG (Windows native
# crypto) when no openssl feature is set — so we avoid the Strawberry-Perl
# build dependency entirely. On Linux/macOS the build still requires system
# libssl/libcrypto headers (libssl-dev / openssl@3 from Homebrew); see
# docs/installation.md.
ssh2 = { version = "0.9", default-features = false }
async-ssh2-lite = { version = "0.5", default-features = false, features = ["tokio"] }
russh-keys = "0.46"
ssh-key = { version = "0.6", default-features = false, features = ["std", "alloc", "ed25519", "p256", "rsa", "encryption", "rand_core", "ecdsa", "getrandom"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
rustls-pemfile = "2"
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
x509-parser = "0.16"

# Email + WebPush transports for spt-events sinks
# Pinned to 0.11.19: 0.11.20+ requires Cargo edition2024 (Rust 1.85). MSRV 1.83.
lettre = { version = "=0.11.22", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "ring", "webpki-roots"] }
# `web-push` 0.11 transitively pulls in `chumsky → stacker` (and lettre also
# pulls `chumsky` independently — `psm` is hand-pinned to 0.1.27 in the
# lockfile). For the WebPush sink we use `web-push-native` instead: it is a
# focused RFC 8030 + RFC 8291 (ECE/aes128gcm) + RFC 8292 (VAPID/ES256)
# implementation with rust-version 1.65 and no chumsky/parser deps. Pairs
# with our existing reqwest transport for the actual HTTPS POST.
web-push-native = { version = "0.4", default-features = false, features = ["vapid"] }
# `jwt-simple` is pulled by `web-push-native` for VAPID ES256 signing.
# Pinned to 0.12.9: 0.12.10+ enables a `superboring` feature path that drags
# `ml-dsa`/`cmov`/`hybrid-array` (edition2024) into the actual build graph
# under workspace feature unification. 0.12.9 + `pure-rust` is MSRV-1.83
# clean — those crates may appear in the lockfile (they're transitive of
# `superboring 0.1.10`'s default features) but are not compiled because
# none of their gating features are activated.
jwt-simple = { version = "=0.12.11", default-features = false, features = ["pure-rust"] }
# `superboring` is `jwt-simple`'s `pure-rust` backend. Pinned to =0.1.7:
# 0.1.8+ enables `ml-dsa` in its default `enabled` feature, which drags
# `cmov`/`hybrid-array`/`digest 0.11`/`signature 3` (all edition2024) into
# the build graph. 0.1.7 is API-compatible (jwt-simple 0.12.9 declares
# `superboring ^0.1.2`).
superboring = "=0.1.10"
# blake2b_simd 1.0.4 requires edition2024; 1.0.3 is the last MSRV-1.83 release.
blake2b_simd = "=1.0.4"
h3 = "0.0.6"
h3-quinn = "0.0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }

# DNS
hickory-server = "0.24"
hickory-resolver = "0.24"
hickory-proto = "0.24"

# Service / OS
windows-service = "0.7"
windows = { version = "0.58", features = ["Win32_System_EventLog", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Foundation"] }
nix = { version = "0.29", features = ["fs", "signal", "user", "mman"] }
caps = "0.5"
socket2 = { version = "0.5", features = ["all"] }

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Networking helpers
ipnet = { version = "2", features = ["serde"] }
if-addrs = "0.13"

# Concurrency
dashmap = "6"
parking_lot = "0.12"

# Misc
url = { version = "2", features = ["serde"] }
hex = "0.4"
base64 = "0.22"
base64ct = "1.7"
http = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
once_cell = "1"

# Dev-dependencies (declared centrally; consumed via { workspace = true })
criterion = { version = "0.5", features = ["html_reports"] }
mockall = "0.13"
assert_cmd = "2"
predicates = "3"
russh = "0.46"
proptest = "1"
insta = { version = "1", features = ["yaml", "json"] }
axum = "0.7"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Reasonable allows for a real-world codebase — not every pedantic lint earns its keep.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
single_match_else = "allow"
multiple_crate_versions = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
