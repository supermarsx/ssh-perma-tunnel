[workspace]
resolver = "2"
members = [
    "crates/spt-bin",
    "crates/spt-core",
    "crates/spt-config",
    "crates/spt-secrets",
    "crates/spt-protocol",
    "crates/spt-ssh2",
    "crates/spt-ssh3",
    "crates/spt-sftp",
    "crates/spt-forward",
    "crates/spt-supervisor",
    "crates/spt-state",
    "crates/spt-net",
    "crates/spt-firewall",
    "crates/spt-dns",
    "crates/spt-events",
    "crates/spt-observability",
    "crates/spt-snmp",
    "crates/spt-winevent",
    "crates/spt-service",
    "crates/spt-key",
    "crates/spt-trust",
    "crates/spt-auth",
    # t6-Bwire: register Phase A/B crates so `cargo {test,clippy} --workspace`
    # exercises them directly. They were already in `[workspace.dependencies]`
    # via t6-e6 / t6-e7 / t6-e9 / t6-e13; this completes their integration.
    "crates/spt-auth-sspi",
    "crates/spt-ftp-translator",
    "crates/spt-obfs",
    "crates/spt-scripting",
    "crates/spt-stats",
    "crates/spt-diagnostics",
    "crates/spt-benchmark",
    "crates/spt-mcp",
    "crates/spt-tui",
    "crates/spt-cli",
    "crates/spt-remote-config",
    "crates/spt-status-api",
    "crates/spt-mem-hygiene",
    "crates/spt-config-crypt",
    # t8-C1: chaos TCP proxy (latency / loss / RST / partition injection).
    # Pure library crate, no integration infra needed — safe as a workspace
    # member so `cargo test --workspace` exercises its behaviour suite.
    "crates/spt-chaos-proxy",
    "tests",
    "tests/conformance",
    "tests/stress",
]
default-members = ["crates/spt-bin"]
# tests/property ships its own [workspace] table + Cargo.lock to pin
# MSRV-clean versions of `arbitrary`/`tempfile` independent of the root
# resolver; tests/chaos spawns the real `spt` binary against
# `spt-chaos-proxy` and stub SSH servers. Both are excluded so
# `cargo test --workspace` stays fast and CI-stable; exercise standalone via
# `cargo test --manifest-path tests/<name>/Cargo.toml`.
exclude = [
    "tests/property",
    "tests/chaos",
    # t7-P1: vendored russh fork (carries a single-line `+ 'static` trait-bound
    # patch on `russh::auth::Signer::Future` so we can drive agent userauth
    # through the russh backend). The fork ships its own `[workspace]` table —
    # excluding it here keeps the outer resolver from absorbing its members.
    "vendor/russh-fork",
    # t7-P3: vendored libgssapi fork (carries additive `gss_get_mic` /
    # `gss_verify_mic` bindings on top of upstream 0.9.1 so the Unix backend
    # can produce real RFC 4462 §3.5 MIC tokens, wire-compatible with strict
    # OpenSSH peers). The fork ships its own `[workspace]` table — excluding
    # it here keeps the outer resolver from absorbing its members. The patch
    # entries below route the registry names to the vendored paths.
    "vendor/libgssapi-fork",
    # Standalone icon-rasterisation tool (resvg + ico + icns). Run via
    # `cargo run --manifest-path tools/icon-build/Cargo.toml`. Kept outside
    # the main workspace so its image-codec dependency tree doesn't bloat
    # `cargo {check,test,clippy} --workspace`.
    "tools/icon-build",
]

# t7-P1: route registry russh / russh-keys / russh-cryptovec to the local
# vendored fork. The only material change vs. upstream russh-v0.46.0 is two
# lines in `vendor/russh-fork/russh/src/auth.rs` adding `+ 'static` to the
# `auth::Signer::Future` trait bound (and the matching `type Future` alias on
# the AgentClient impl). See `.orchestration/logs/t7-P1.md` for the full
# rationale and the upstream-PR path.
[patch.crates-io]
russh = { path = "vendor/russh-fork/russh" }
russh-keys = { path = "vendor/russh-fork/russh-keys" }
russh-cryptovec = { path = "vendor/russh-fork/cryptovec" }
# t7-P3: route the registry `libgssapi` and `libgssapi-sys` names to the
# vendored fork under `vendor/libgssapi-fork/`. The fork is identical to
# upstream 0.9.1 / 0.3.3 except for additive `gss_get_mic` / `gss_verify_mic`
# bindings on `libgssapi::context::SecurityContext`, needed to produce real
# RFC 4462 §3.5 MIC tokens (wire-compatible with strict OpenSSH peers). See
# `.orchestration/logs/t7-P3.md` for the diff. `libgssapi-sys` is patched
# too even though no source changes are required, so that path resolution
# in the vendored sibling reference matches the registry name spt-auth-sspi
# resolves transitively.
libgssapi = { path = "vendor/libgssapi-fork/libgssapi" }
libgssapi-sys = { path = "vendor/libgssapi-fork/libgssapi-sys" }

[workspace.package]
# Rolling release: 0.YY.N (SemVer-compatible encoding of YY.N — two-digit
# UTC year + monotonic counter that resets each year). The leading `0.` is
# required because Cargo's TOML parser enforces full SemVer X.Y.Z and
# rejects the bare `YY.N` form (`error: unexpected end of input while
# parsing minor version number`). Public-facing tags drop the `0.` prefix
# (`v26.1`, not `v0.26.1`).
#
# The `# rolling` marker is load-bearing — `scripts/release/bump-version.sh`
# greps for it to perform an unambiguous in-place rewrite. See
# `releasing.md` and `docs/releases/readme.md`.
version = "0.26.3"  # rolling
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Mariana/ssh-perma-tunnel"
homepage = "https://github.com/Mariana/ssh-perma-tunnel"
authors = ["Mariana"]
description = "Permanent SSH2/SSH3 tunnels with reconnect, observability, and service integration."
readme = "readme.md"

[workspace.dependencies]
# Internal crates
spt-core = { path = "crates/spt-core", version = "0.26.1" }
spt-config = { path = "crates/spt-config", version = "0.26.1" }
spt-secrets = { path = "crates/spt-secrets", version = "0.26.1" }
spt-protocol = { path = "crates/spt-protocol", version = "0.26.1" }
spt-ssh2 = { path = "crates/spt-ssh2", version = "0.26.1" }
spt-ssh3 = { path = "crates/spt-ssh3", version = "0.26.1" }
spt-sftp = { path = "crates/spt-sftp", version = "0.26.1" }
spt-forward = { path = "crates/spt-forward", version = "0.26.1" }
spt-supervisor = { path = "crates/spt-supervisor", version = "0.26.1" }
spt-state = { path = "crates/spt-state", version = "0.26.1" }
spt-net = { path = "crates/spt-net", version = "0.26.1" }
spt-firewall = { path = "crates/spt-firewall", version = "0.26.1" }
spt-dns = { path = "crates/spt-dns", version = "0.26.1" }
spt-events = { path = "crates/spt-events", version = "0.26.1" }
spt-observability = { path = "crates/spt-observability", version = "0.26.1" }
spt-snmp = { path = "crates/spt-snmp", version = "0.26.1" }
spt-winevent = { path = "crates/spt-winevent", version = "0.26.1" }
spt-service = { path = "crates/spt-service", version = "0.26.1" }
spt-key = { path = "crates/spt-key", version = "0.26.1" }
spt-trust = { path = "crates/spt-trust", version = "0.26.1" }
spt-auth = { path = "crates/spt-auth", version = "0.26.1" }
spt-auth-sspi = { path = "crates/spt-auth-sspi", version = "0.26.1" }
spt-scripting = { path = "crates/spt-scripting", version = "0.26.1" }
# t6-e13 — obfuscation transports crate. NOT in `[workspace.members]`
# yet; t6-Bwire owns that edit per the t6.md phasing table.
spt-obfs = { path = "crates/spt-obfs", version = "0.26.1" }
# t6-e6 — new FTP-to-SFTP translator crate. NOT in `[workspace.members]`
# yet; t6-Bwire owns that edit per the t6.md phasing table.
spt-ftp-translator = { path = "crates/spt-ftp-translator", version = "0.26.1" }
spt-stats = { path = "crates/spt-stats", version = "0.26.1" }
spt-diagnostics = { path = "crates/spt-diagnostics", version = "0.26.1" }
spt-benchmark = { path = "crates/spt-benchmark", version = "0.26.1" }
spt-mcp = { path = "crates/spt-mcp", version = "0.26.1" }
spt-tui = { path = "crates/spt-tui", version = "0.26.1" }
spt-cli = { path = "crates/spt-cli", version = "0.26.1" }
spt-remote-config = { path = "crates/spt-remote-config", version = "0.26.1" }
spt-status-api = { path = "crates/spt-status-api", version = "0.26.1" }
spt-mem-hygiene = { path = "crates/spt-mem-hygiene", version = "0.26.1" }
spt-config-crypt = { path = "crates/spt-config-crypt", version = "0.26.1" }
# t8-C1 — chaos TCP proxy library, consumed by `tests/chaos` (which is its
# own decoupled workspace) and any future in-process chaos test.
spt-chaos-proxy = { path = "crates/spt-chaos-proxy", version = "0.26.1" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# CLI
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
# t9-Bump: was `=0.2.31`. MSRV is now 1.85, so the edition2024 / roff 1.x
# concerns are moot. Bumped to 0.3.0 (rust-version 1.85, latest stable).
clap_mangen = "0.3"

# Serde / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"
humantime = "2"
humantime-serde = "1"
bytesize = "1"
serde_ignored = "0.1"

# Errors / diagnostics
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
anyhow = "1"

# Logging / tracing / metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
tracing-journald = "0.3"
opentelemetry = "0.24"
opentelemetry-otlp = { version = "0.17", default-features = false, features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio", "trace", "metrics", "logs"] }
prometheus = "0.14"

# Filesystem / paths
directories = "6"
notify = "6"
notify-debouncer-full = "0.3"
fs4 = "1"
atomicwrites = "0.4"
tempfile = "3"

# Crypto / secrets
zeroize = { version = "1.7", features = ["zeroize_derive"] }
secrecy = "0.10"
keyring = "3"
aes-gcm = "0.10"
aes = "0.8"
cfb-mode = "0.8"
argon2 = "0.5"
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
subtle = "2"
bytes = "1"
# t8-D2: replace `slice::from_raw_parts(p.cast::<u8>(), len * size_of::<T>())`
# casts in spt-winevent registry-write paths with safe `IntoBytes` calls.
# Pinned to the major-0.8 line already present transitively in the lockfile.
zerocopy = "0.8"

# SSH / networking transports — pure-Rust russh stack (libssh2 was removed in t7-Phase0).
russh-keys = "0.46"
# t9-Bump: was `=2.1.2`. 2.2.x is API-compatible (patch); bumped to 2.2.
russh-sftp = "2.2"
ssh-key = { version = "0.6", default-features = false, features = ["std", "alloc", "ed25519", "p256", "rsa", "encryption", "rand_core", "ecdsa", "getrandom"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
x509-parser = "0.18"

# Email + WebPush transports for spt-events sinks
# t9-Bump: was `=0.11.19`. MSRV is now 1.85, so the edition2024 concern is
# moot. Bumped to 0.11.22 (rust-version 1.85, latest stable).
lettre = { version = "0.11.22", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "ring", "webpki-roots"] }
# `web-push` 0.11 transitively pulls in `chumsky → stacker` (and lettre also
# pulls `chumsky` independently — `psm` is hand-pinned to 0.1.27 in the
# lockfile). For the WebPush sink we use `web-push-native` instead: it is a
# focused RFC 8030 + RFC 8291 (ECE/aes128gcm) + RFC 8292 (VAPID/ES256)
# implementation with rust-version 1.65 and no chumsky/parser deps. Pairs
# with our existing reqwest transport for the actual HTTPS POST.
web-push-native = { version = "0.4", default-features = false, features = ["vapid"] }
# `jwt-simple` is pulled by `web-push-native` for VAPID ES256 signing.
# t9-Bump re-evaluation: bumped to 0.12.16 was attempted but reverted — see
# `superboring` below. Original pin retained at 0.12.9.
jwt-simple = { version = "=0.12.9", default-features = false, features = ["pure-rust"] }
# `superboring` is `jwt-simple`'s `pure-rust` backend. Pinned at =0.1.5:
# 0.1.6+ requires `aes-keywrap ^0.9.0`, and `aes-keywrap 0.9.0` uses
# `u*::is_multiple_of` (stabilized in Rust 1.87) which is unavailable under
# workspace MSRV 1.85. The crate is the LAST version not requiring that
# dependency. (Pre-t9-Bump rationale cited edition2024; that's now moot, but
# the aes-keywrap MSRV-1.87 floor is the binding constraint.)
superboring = "=0.1.5"
# t9-Bump: was `=1.0.3` (edition2024 concern). MSRV is now 1.85 — bumped to 1.0.4.
blake2b_simd = "1.0.4"
h3 = "0.0.6"
h3-quinn = "0.0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }

# DNS
hickory-server = "0.24"
hickory-resolver = "0.24"
hickory-proto = "0.24"

# Service / OS
windows-service = "0.8"
windows = { version = "0.58", features = ["Win32_System_EventLog", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Foundation"] }
nix = { version = "0.29", features = ["fs", "signal", "user", "mman"] }
# `libc` is consumed by spt-mem-hygiene (and transitively by many other deps).
# Pinned indirectly via lockfile; this just exposes the symbol to workspace
# members without bumping the resolved version.
libc = "0.2"
caps = "0.5"
socket2 = { version = "0.6", features = ["all"] }

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Networking helpers
ipnet = { version = "2", features = ["serde"] }
if-addrs = "0.15"

# Concurrency
dashmap = "6"
parking_lot = "0.12"

# Misc
url = { version = "2", features = ["serde"] }
hex = "0.4"
base64 = "0.22"
base64ct = "1.7"
http = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
once_cell = "1"

# Dev-dependencies (declared centrally; consumed via { workspace = true })
criterion = { version = "0.5", features = ["html_reports"] }
mockall = "0.14"
assert_cmd = "2.2"
predicates = "3"
russh = "0.46"
proptest = "1.11"
insta = { version = "1", features = ["yaml", "json"] }
axum = "0.7"
# tower / tower-http for spt-status-api. Versions pinned to the entries already
# present in Cargo.lock so registering these in the workspace table does NOT
# trigger a `cargo update`. tower-http 0.6 depends on tower 0.5; axum 0.7 keeps
# tower 0.4 as a transitive dep — both coexist in the lockfile.
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["trace", "limit"] }
# rcgen — self-signed certs for spt-status-api TLS dev/test fixtures.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Reasonable allows for a real-world codebase — not every pedantic lint earns its keep.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
single_match_else = "allow"
multiple_crate_versions = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
